<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algo-Memory · 알고리즘 통암기 스케줄러</title>
<meta name="description" content="코딩테스트 대표 유형 코드를 통째로 외우고, 백지 재현으로 정말 외웠는지 검증하는 도구. 검증된 파이썬 템플릿 70개와 에빙하우스 망각곡선 스케줄러.">
<meta name="theme-color" content="#14755c">
<meta property="og:type" content="website">
<meta property="og:title" content="Algo-Memory · 알고리즘 통암기 스케줄러">
<meta property="og:description" content="깜지로 손에 넣고 백지로 검증한다. 검증된 파이썬 템플릿 70개, 난이도 6단계, 망각곡선 복습, 줄별 해설.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>

<header>
  <div class="hbar">
    <button class="iconbtn" id="backBtn" data-act="back" title="뒤로" aria-label="뒤로" hidden>←</button>
    <div class="brand">
      <span class="dot"></span>
      <span>Algo-Memory<small>ebbinghaus drill</small></span>
    </div>
    <span class="hspace"></span>
    <span class="today mono" id="todayLabel"></span>
    <button class="btn sm ghost account-btn" id="accountBtn" type="button" hidden>로그인</button>
    <button class="iconbtn" id="themeBtn" title="테마 전환" aria-label="테마 전환">◐</button>
  </div>
  <nav id="nav">
    <button data-v="dash" aria-current="true">대시보드<span class="badge" id="navDue" hidden>0</span></button>
    <button data-v="pack">코스</button>
    <button data-v="bank">문제 은행</button>
    <button data-v="stats">통계</button>
    <button data-v="settings">설정</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-dash"></section>
  <section class="view" id="v-pack"></section>
  <section class="view" id="v-bank"></section>
  <section class="view" id="v-test"></section>
  <section class="view" id="v-drill"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-settings"></section>
</main>

<div class="landing" id="landing" hidden></div>

<div class="toast" id="toast"></div>
<div id="authRoot" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" defer></script>

</html>
