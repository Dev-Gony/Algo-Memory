name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  catalog:
    name: 문제 템플릿 실행 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 파이썬 템플릿 70개 실행
        run: python3 content/catalog3.py
      - name: SQL 템플릿 35개 실행 (sqlite3 로 실제 질의)
        run: python3 content/sql_catalog.py
      - name: 생성된 카탈로그가 커밋본과 같은지
        run: git diff --exit-code src/catalog.json src/sql-catalog.json

      - name: 문제 설명·스키마 콘텐츠 품질 검증
        run: node test/content-eval.js

  app:
    name: 빌드 + 종단 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-audit --no-fund
      - run: npm test
