<script>
(function () {
'use strict';

/* ============ utils ============ */
var $ = function (s) { return document.querySelector(s); };
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return String(n).padStart(2, '0'); }
function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return dstr(new Date()); }
function addDays(ds, n) {
  var p = ds.split('-').map(Number), dt = new Date(p[0], p[1] - 1, p[2]);
  dt.setDate(dt.getDate() + n); return dstr(dt);
}
function dayDiff(a, b) {
  var x = a.split('-').map(Number), y = b.split('-').map(Number);
  return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 86400000);
}
function relDate(ds) {
  var d = dayDiff(today(), ds);
  if (d === 0) return '오늘'; if (d === 1) return '내일'; if (d === -1) return '어제';
  if (d < 0) return Math.abs(d) + '일 지남';
  return ds.slice(5).replace('-', '/');
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200);
}
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
function num(id, dflt) { var v = parseInt(val(id), 10); return isNaN(v) ? (dflt || 0) : v; }

var CATS = ['구현', '완전탐색', 'DFS', 'BFS', '백트래킹', '이분탐색', '투포인터', '정렬', '그리디',
  'DP', '그래프', '최단경로', '최소신장트리', '분리집합', '문자열', '자료구조', '수학', '비트마스킹', '트리', '우선순위큐'];
var LANGS = ['python', 'java', 'cpp', 'javascript', 'kotlin'];
var LANG_LABEL = { python: 'Python', java: 'Java', cpp: 'C++', javascript: 'JavaScript', kotlin: 'Kotlin' };

/* ============ state ============ */
var CATALOG = [{"id":"s0-var","cat":"기초 문법","title":"변수와 출력","brief":"값을 이름에 담고 화면에 찍는다.","limits":"제일 처음 외울 3줄","logic":"= 는 '같다'가 아니라 오른쪽 값을 왼쪽 이름에 넣으라는 뜻이다. print에 쉼표로 여러 개를 넘기면 사이에 한 칸이 저절로 들어간다.","code":"name = \"gony\"\nage = 35\nscore = 92.5\n\nprint(name)\nprint(age, score)\nprint(\"name:\", name)","lv":1,"story":"프로그램이 값을 기억하는 방법이다. 이름표가 붙은 상자에 값을 넣어두고, 나중에 그 이름으로 꺼내 쓴다. print 는 그 값을 화면에 내보내는 명령이다.","where":"모든 코드의 첫 줄이다. 코테에서는 입력받은 숫자를 변수에 담는 것으로 풀이가 시작된다.","keys":["= 는 '같다'가 아니라 '넣어라'라는 뜻이다","따옴표로 감싸면 글자, 안 감싸면 숫자다","print 에 쉼표로 여러 개를 넘기면 사이에 한 칸이 저절로 들어간다"],"walk":["name 이라는 상자에 글자 \"gony\" 를 넣는다. 따옴표가 있으니 문자열이다.","age 라는 상자에 숫자 35 를 넣는다. 따옴표가 없으니 계산할 수 있는 수다.","score 에 92.5 를 넣는다. 소수점이 있는 수도 그냥 넣으면 된다.","name 상자를 열어 안에 든 값을 화면에 찍는다. gony 가 나온다.","쉼표로 두 개를 한 줄에 찍는다. 사이에 공백 한 칸이 자동으로 들어간다.","글자와 변수를 섞어서 찍는다. 따옴표 안은 그대로 나오고 name 은 값으로 바뀐다."]},{"id":"s0-math","cat":"기초 문법","title":"사칙연산과 나머지","brief":"더하기 빼기 곱하기 나누기, 그리고 몫과 나머지.","limits":"% 와 // 를 구분하는 게 전부","logic":"/ 는 소수점까지 나오는 나눗셈, // 는 몫만, % 는 나머지. 짝수 판별은 % 2 == 0, 배수 판별은 % k == 0 이 전부다.","code":"a = 7\nb = 3\n\nprint(a + b)\nprint(a - b)\nprint(a * b)\nprint(a // b)\nprint(a % b)","lv":1,"story":"숫자를 다루는 다섯 가지 연산이다. 더하기 빼기 곱하기는 아는 대로지만, 나눗셈만 두 종류로 갈린다. 몫만 필요할 때와 나머지가 필요할 때가 다르기 때문이다.","where":"짝수·홀수 판별, 배수 찾기, 자릿수 분리가 전부 % 하나로 풀린다. 코테에서 가장 자주 쓰는 연산자다.","keys":["// 는 몫만, % 는 나머지만 준다","짝수 판별은 x % 2 == 0, 배수 판별은 x % k == 0","/ 는 나누어떨어져도 소수점이 붙은 결과를 준다"],"walk":["a 에 7 을 넣는다.","b 에 3 을 넣는다.","7 + 3 을 찍는다. 10 이 나온다.","7 - 3 을 찍는다. 4 가 나온다.","7 × 3 을 찍는다. 21 이 나온다. 곱하기 기호는 * 다.","7 을 3 으로 나눈 몫만 취한다. 2 가 나온다. 슬래시 두 개인 것에 주의.","7 을 3 으로 나눈 나머지다. 1 이 나온다. 이 한 줄이 짝홀·배수 판별의 전부다."]},{"id":"s0-func","cat":"기초 문법","title":"함수 만들기","brief":"재료를 받아 결과를 돌려주는 상자를 만든다.","limits":"앞으로 나올 모든 코드의 껍데기","logic":"def 이름(재료): 로 시작하고 return 으로 결과를 돌려준다. return 을 안 쓰면 None이 나온다. 함수 안쪽은 반드시 네 칸 들여쓴다.","code":"def add(a, b):\n    return a + b\n\n\ndef greet(name):\n    return \"hi \" + name\n\n\nprint(add(2, 3))\nprint(greet(\"gony\"))","lv":1,"story":"자주 쓰는 작업을 상자에 넣어두고 이름을 붙이는 것이다. 재료를 넣으면 결과가 나온다. 한 번 만들어두면 이름만 불러서 몇 번이든 다시 쓸 수 있다.","where":"코테 풀이는 대부분 def solve(...) 하나로 시작한다. 재귀·백트래킹은 함수가 없으면 아예 쓸 수 없다.","keys":["def 이름(재료): 로 시작하고 return 으로 결과를 돌려준다","return 이 없으면 아무것도 안 돌려준다 (None)","함수 안쪽은 반드시 네 칸 들여쓴다. 들여쓰기가 곧 '이 함수 소속'이라는 표시다"],"walk":["add 라는 함수를 만든다. a 와 b 두 개를 재료로 받는다. 끝의 콜론을 빼먹으면 에러다.","받은 두 값을 더해서 돌려준다. return 을 만나면 함수는 그 자리에서 끝난다.","greet 라는 함수를 만든다. name 하나만 받는다.","글자끼리도 + 로 이어붙일 수 있다. \"hi \" 뒤의 공백에 주의.","add 를 실제로 불러 쓴다. 2 와 3 이 a, b 자리로 들어가 5 가 나온다.","greet 를 불러 쓴다. \"gony\" 가 name 자리로 들어가 hi gony 가 나온다."]},{"id":"s0-if","cat":"기초 문법","title":"if 조건문","brief":"점수에 따라 등급을 돌려준다.","limits":"조건은 위에서부터 차례로 검사된다","logic":"처음 맞는 조건에서 멈추고 나머지는 보지 않는다. 그래서 90점 조건을 80점 조건보다 먼저 써야 한다. 조건 끝의 콜론과 들여쓰기가 첫 관문.","code":"def grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    else:\n        return \"C\"","lv":1,"story":"조건에 따라 다른 길로 가는 갈림길이다. 위에서부터 차례로 검사하다가 처음 맞는 곳에서 멈춘다. 그래서 조건을 쓰는 순서 자체가 논리의 일부다.","where":"\"~인 경우에만\" 이라는 말이 문제에 나오면 전부 if 다. 예외 처리, 경계값 처리가 모두 여기 들어간다.","keys":["위에서부터 검사하고 처음 맞는 곳에서 멈춘다","그래서 90점 조건을 80점 조건보다 먼저 써야 한다","조건 끝의 콜론과 들여쓰기가 첫 관문이다"],"walk":["grade 함수를 만든다. 점수 하나를 받는다.","점수가 90 이상인지 본다. >= 는 크거나 같다는 뜻이다.","90 이상이면 \"A\" 를 돌려주고 여기서 끝난다. 아래는 보지도 않는다.","90 미만일 때만 여기로 온다. elif 는 \"아니면 그다음으로\"다.","80 이상 90 미만이면 \"B\".","위 조건이 전부 아니면 여기로 온다. else 에는 조건을 안 쓴다.","나머지는 전부 \"C\"."]},{"id":"s0-for","cat":"기초 문법","title":"for 반복문","brief":"정해진 횟수만큼 돌면서 값을 쌓는다.","limits":"range의 시작과 끝을 외운다","logic":"range(n)은 0부터 n-1까지다. 1부터 n까지 돌리려면 range(1, n + 1)로 써야 한다. 이 한 칸 차이가 초보 때 제일 많이 틀리는 자리.","code":"def sum_to(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i\n    return total\n\n\ndef repeat(word, n):\n    for i in range(n):\n        print(i, word)","lv":1,"story":"정해진 횟수만큼 같은 일을 반복한다. 1부터 100까지 더하는 일을 사람은 100줄로 쓰지 않고 \"1부터 100까지 하나씩 더해라\" 한 문장으로 말한다. for 가 그 문장이다.","where":"배열을 훑고, 격자를 훑고, 경우의 수를 세는 모든 곳에 있다. 코테 코드의 절반은 for 문이다.","keys":["range(n) 은 0부터 n-1 까지다. n 은 포함되지 않는다","1부터 n 까지 돌리려면 range(1, n + 1) 로 써야 한다","합을 담을 그릇은 반드시 루프 밖에서 0으로 만든다"],"walk":["1부터 n 까지 더하는 함수를 만든다.","합을 담을 그릇을 0으로 먼저 준비한다. 이 줄이 루프 안에 들어가면 매번 0으로 초기화돼서 답이 틀린다.","i 에 1, 2, 3 … n 이 차례로 들어간다. n + 1 이라 써야 n 까지 들어간다.","total = total + i 의 줄임말이다. 돌 때마다 i 를 더해 쌓는다.","루프가 끝난 뒤 쌓인 값을 돌려준다. 들여쓰기가 for 보다 왼쪽인 것에 주의.","단어를 n 번 반복 출력하는 함수다.","i 에 0, 1, 2 … n-1 이 들어간다. 여기서는 횟수만 필요해서 시작값을 안 적었다.","번호와 단어를 같이 찍는다."]},{"id":"s0-while","cat":"기초 문법","title":"while 반복문","brief":"조건이 참인 동안 계속 돈다.","limits":"멈추는 줄을 빠뜨리면 무한 루프","logic":"횟수를 미리 알면 for, 조건으로 멈춰야 하면 while. 루프 안에서 조건에 쓰는 값을 반드시 바꿔줘야 끝난다.","code":"def count_down(n):\n    result = []\n    while n > 0:\n        result.append(n)\n        n -= 1\n    return result","lv":1,"story":"몇 번 돌지 모를 때 쓰는 반복이다. \"조건이 참인 동안 계속\" 이라는 뜻이라, 안에서 조건을 바꿔주지 않으면 영원히 멈추지 않는다.","where":"값이 0이 될 때까지, 큐가 빌 때까지 같은 상황에 쓴다. BFS 의 뼈대가 while 이다.","keys":["횟수를 알면 for, 조건으로 멈춰야 하면 while","루프 안에서 조건에 쓰는 값을 반드시 바꿔야 끝난다","n -= 1 을 빼먹으면 무한 루프다"],"walk":["n 부터 1까지 거꾸로 담는 함수다.","결과를 담을 빈 리스트를 준비한다.","n 이 0보다 큰 동안 계속 돈다. 한 바퀴 돌 때마다 이 조건을 다시 검사한다.","지금의 n 을 리스트 뒤에 붙인다. append 는 \"뒤에 추가\"다.","n 을 1 줄인다. 이 줄이 없으면 조건이 영원히 참이라 프로그램이 멈추지 않는다.","다 담긴 리스트를 돌려준다."]},{"id":"s0-loopif","cat":"기초 문법","title":"반복문 안의 조건문","brief":"여러 값 중 조건에 맞는 것만 골라낸다.","limits":"for 와 if 를 겹쳐 쓰는 첫 연습","logic":"빈 그릇을 루프 밖에서 먼저 만든다. 루프 안에서 만들면 매번 비워져서 마지막 하나만 남는다. 이게 초보 단계 최다 실수.","code":"def even_numbers(n):\n    result = []\n    for i in range(1, n + 1):\n        if i % 2 == 0:\n            result.append(i)\n    return result\n\n\ndef count_multiples(nums, k):\n    count = 0\n    for x in nums:\n        if x % k == 0:\n            count += 1\n    return count","lv":1,"story":"반복문 안에 조건문을 넣어 \"전부 훑으면서 조건에 맞는 것만\" 골라낸다. 지금까지 배운 for 와 if 를 겹쳐 쓰는 첫 연습이고, 실제 코드는 거의 다 이 모양이다.","where":"필터링·카운팅 문제 전부. 프로그래머스 Lv1 의 상당수가 이 구조 하나로 풀린다.","keys":["빈 그릇은 루프 밖에서 만든다. 안에서 만들면 매번 비워진다","골라 담기는 append, 세기는 count += 1","이 둘이 초보 단계 최다 실수 지점이다"],"walk":["n 이하의 짝수를 모으는 함수다.","담을 그릇을 루프 밖에서 준비한다. 이 위치가 핵심이다.","1부터 n 까지 하나씩 본다.","2로 나눈 나머지가 0이면 짝수다.","짝수일 때만 그릇에 넣는다. 들여쓰기가 if 보다 더 안쪽인 것에 주의.","다 모은 리스트를 돌려준다.","이번엔 담지 않고 개수만 세는 함수다.","숫자를 셀 그릇도 마찬가지로 루프 밖에서 0으로 준비한다.","nums 의 값을 하나씩 x 에 꺼낸다. 인덱스가 필요 없으면 이 형태가 편하다.","k 의 배수인지 검사한다.","맞을 때만 1 씩 올린다.","센 개수를 돌려준다."]},{"id":"s0-list","cat":"기초 자료형","title":"리스트 기본","brief":"값 여러 개를 한 줄에 담고 꺼낸다.","limits":"번호는 0부터, 뒤에서는 -1","logic":"슬라이싱 [1:3] 은 1번부터 3번 '앞'까지라 3번은 안 들어온다. 끝 번호를 포함하지 않는다는 게 파이썬의 일관된 규칙.","code":"def list_basics():\n    nums = [10, 20, 30]\n    nums.append(40)\n    first = nums[0]\n    last = nums[-1]\n    part = nums[1:3]\n    size = len(nums)\n    return nums, first, last, part, size","lv":1,"story":"값 여러 개를 한 줄에 묶어 담는 상자다. 각 칸에 번호가 붙어 있어서 번호로 꺼낸다. 번호는 1이 아니라 0부터 시작한다는 게 처음에 제일 헷갈리는 부분이다.","where":"입력받은 수들, 격자의 한 줄, 방문 여부 기록. 코테에서 데이터는 거의 다 리스트에 담긴다.","keys":["번호는 0부터 시작하고 -1 은 맨 뒤를 뜻한다","[1:3] 은 1번부터 3번 '앞'까지라 3번은 안 들어온다","끝 번호를 포함하지 않는 것이 파이썬의 일관된 규칙이다"],"walk":["리스트의 기본 동작을 모아놓은 함수다.","값 세 개를 담은 리스트를 만든다. 대괄호로 감싸고 쉼표로 나눈다.","맨 뒤에 40 을 붙인다. 리스트는 만든 뒤에도 늘릴 수 있다.","0번 칸을 꺼낸다. 첫 번째가 1번이 아니라 0번이다.","-1 은 맨 뒤 칸이다. 길이를 몰라도 마지막을 꺼낼 수 있다.","1번부터 3번 앞까지, 즉 1번과 2번만 잘라낸다. 3번은 안 들어온다.","len 은 칸이 몇 개인지 세어준다. append 를 했으니 4 다.","여러 값을 한 번에 돌려줄 수 있다. 쉼표로 나열하면 묶음으로 나간다."]},{"id":"s0-listsum","cat":"기초 자료형","title":"리스트 훑으며 합과 개수","brief":"전부 더하고, 조건에 맞는 것을 세고, 평균을 낸다.","limits":"N ≤ 1,000,000","logic":"합을 담을 그릇을 0으로 두고 루프 안에서 더한다. total = 0 을 루프 안에 쓰면 매번 초기화돼서 마지막 값만 남는다.","code":"def summarize(nums):\n    total = 0\n    count = 0\n    for x in nums:\n        total += x\n        if x > 0:\n            count += 1\n    average = total / len(nums)\n    return total, count, average","lv":1,"story":"리스트를 처음부터 끝까지 훑으면서 합을 쌓고 조건에 맞는 것을 센다. \"전부 보면서 무언가를 누적한다\"는 가장 흔한 작업의 원형이다.","where":"평균 구하기, 조건 만족 개수 세기, 최댓값 찾기가 전부 이 뼈대에서 나온다.","keys":["누적할 그릇은 루프 밖에서 0으로 만든다","for x in nums 는 값만 필요할 때 쓰는 형태다","평균은 합을 개수로 나눈다. len 이 0이면 에러가 나니 주의"],"walk":["합·개수·평균을 한 번에 구하는 함수다.","합을 담을 그릇.","개수를 셀 그릇. 둘 다 루프 밖이다.","nums 의 값을 하나씩 x 에 꺼낸다.","꺼낸 값을 합에 더한다. 모든 값에 대해 실행된다.","양수인지 검사한다. 이 줄부터가 조건부다.","양수일 때만 개수를 올린다.","합을 개수로 나눠 평균을 낸다. len(nums) 는 전체 개수다.","세 값을 한 번에 돌려준다."]},{"id":"s0-str","cat":"기초 자료형","title":"문자열 꺼내 쓰기","brief":"글자 하나, 뒷글자, 일부분, 길이, 대문자.","limits":"리스트와 꺼내는 방법이 똑같다","logic":"문자열도 리스트처럼 번호로 꺼낸다. 다만 s[0] = 'x' 처럼 바꾸는 건 안 된다. 바꾸려면 새 문자열을 만들어야 한다.","code":"def string_intro(s):\n    first = s[0]\n    last = s[-1]\n    part = s[1:4]\n    length = len(s)\n    upper = s.upper()\n    return first, last, part, length, upper","lv":1,"story":"문자열도 리스트처럼 번호로 한 글자씩 꺼낼 수 있다. 다만 리스트와 달리 한 번 만들면 내용을 바꿀 수 없다. 바꾸려면 새 문자열을 만들어야 한다.","where":"문자열 뒤집기, 회문 판별, 특정 글자 세기 등 문자열 문제의 출발점이다.","keys":["s[0] 은 첫 글자, s[-1] 은 마지막 글자","s[0] = 'x' 처럼 바꾸는 것은 불가능하다","슬라이싱 [1:4] 는 1, 2, 3 번 글자다"],"walk":["문자열에서 꺼내는 방법을 모아놓은 함수다.","첫 글자를 꺼낸다. \"python\" 이면 p 다.","마지막 글자를 꺼낸다. n 이다.","1번부터 4번 앞까지, 즉 y t h 세 글자다.","글자 수를 센다. 리스트와 똑같이 len 을 쓴다.","전부 대문자로 바꾼 새 문자열을 만든다. 원본 s 는 그대로다.","다섯 값을 한 번에 돌려준다."]},{"id":"s0-dict","cat":"기초 자료형","title":"딕셔너리 기본","brief":"번호 대신 이름표로 값을 꺼낸다.","limits":"없는 키를 꺼내면 에러가 난다","logic":"리스트는 번호로, 딕셔너리는 이름표로 꺼낸다. 없는 이름표를 [] 로 꺼내면 바로 에러라 in 으로 먼저 확인하거나 .get() 을 쓴다.","code":"def dict_basics():\n    ages = {\"ann\": 35, \"bob\": 28}\n    ages[\"cara\"] = 22\n    ann = ages[\"ann\"]\n    has_bob = \"bob\" in ages\n    safe = ages.get(\"dave\", 0)\n    return ages, ann, has_bob, safe","lv":1,"story":"리스트가 번호로 꺼낸다면 딕셔너리는 이름표로 꺼낸다. \"고니의 나이\" 처럼 짝지어진 정보를 담을 때 쓴다. 이름표로 찾는 속도가 매우 빠른 것이 핵심 장점이다.","where":"개수 세기, 짝 맞추기, 이미 본 값인지 확인하기. 해시 문제의 절반이 딕셔너리로 풀린다.","keys":["리스트는 번호로, 딕셔너리는 이름표(키)로 꺼낸다","없는 키를 [] 로 꺼내면 바로 에러가 난다","in 으로 먼저 확인하거나 .get() 을 쓰면 안전하다"],"walk":["딕셔너리의 기본 동작을 모아놓은 함수다.","중괄호로 만든다. \"이름표: 값\" 을 쉼표로 나열한다.","없던 이름표에 값을 넣으면 새로 생긴다. 리스트의 append 에 해당한다.","이름표로 값을 꺼낸다. 35 가 나온다.","in 은 그 이름표가 있는지 참·거짓으로 알려준다.",".get 은 없는 이름표를 물어도 에러 대신 정해둔 값을 준다. 여기서는 0.","네 값을 한 번에 돌려준다."]},{"id":"s0-input","cat":"기초 입출력","title":"입력 받기","brief":"숫자 하나, 한 줄에 여러 수, 단어 목록을 읽는다.","limits":"입력이 적을 때 쓰는 기본형","logic":"input()은 무조건 글자로 들어온다. 숫자로 쓰려면 int()로 바꿔야 한다. 한 줄에 여러 개면 split()으로 쪼갠 뒤 map(int, ...)로 한꺼번에 바꾼다.","code":"def read_simple():\n    n = int(input())\n    a, b = map(int, input().split())\n    words = input().split()\n    return n, a, b, words","lv":1,"story":"프로그램 밖에서 값을 받아오는 방법이다. 코테는 항상 입력을 읽는 것으로 시작한다. 받아온 값은 무조건 글자라서, 계산하려면 숫자로 바꾸는 한 단계가 반드시 필요하다.","where":"모든 코테 문제의 첫 줄. 이걸 못 하면 문제를 풀 수조차 없다.","keys":["input() 이 주는 것은 언제나 글자다","숫자로 쓰려면 int() 로 감싸야 한다","한 줄에 여러 개면 split() 으로 쪼갠 뒤 map(int, ...) 로 한꺼번에 바꾼다"],"walk":["입력을 여러 형태로 읽는 함수다.","한 줄을 읽어 정수로 바꾼다. int 로 안 감싸면 \"5\" 라는 글자가 되어 계산이 안 된다.","한 줄에 두 수가 있을 때다. split 으로 쪼개고 map(int, ...) 로 전부 숫자로 바꾼 뒤 a, b 에 나눠 담는다.","단어 여러 개는 쪼개기만 하면 된다. 숫자로 바꿀 필요가 없으니 map 이 없다.","읽은 것들을 한 번에 돌려준다."]},{"id":"py-listcomp","cat":"파이썬 기본","title":"리스트 컴프리헨션","brief":"반복문으로 쓰던 리스트 만들기를 한 줄로 바꾼다.","limits":"가장 많이 쓰는 문법 / 손에 붙을 때까지","logic":"[식 for 변수 in 반복가능 if 조건] 순서. 조건이 먼저 걸러지고 식이 적용된다. 중첩은 바깥 for를 먼저 쓴다.","code":"def transform(nums):\n    squares = [x * x for x in nums]\n    evens = [x for x in nums if x % 2 == 0]\n    labeled = [(i, x) for i, x in enumerate(nums)]\n    return squares, evens, labeled","lv":2,"story":"for 문으로 서너 줄 걸리던 '리스트 만들기'를 한 줄로 줄이는 문법이다. 결과를 담을 빈 리스트와 append 가 통째로 사라진다.","where":"코테에서 격자 만들기, 조건 필터링, 입력 파싱이 전부 한 줄로 끝난다. 실무 코드에서도 가장 흔하다.","keys":["[식 for 변수 in 반복가능 if 조건] 순서로 읽는다","조건이 먼저 걸러지고 살아남은 것에 식이 적용된다","빈 리스트와 append 가 필요 없어진다"],"walk":["세 가지 형태를 한 함수에 모았다.","각 값을 제곱한 새 리스트다. for 문 세 줄이 한 줄이 됐다.","if 를 붙이면 조건에 맞는 것만 남는다. 여기서는 짝수만.","(번호, 값) 쌍을 만든다. 괄호로 묶으면 튜플이 된다.","세 리스트를 한 번에 돌려준다."]},{"id":"py-count","cat":"파이썬 기본","title":"딕셔너리로 개수 세기","brief":"등장 횟수를 세고 가장 많이 나온 것을 찾는다.","limits":"해시 문제의 절반은 이걸로 풀린다","logic":"get(x, 0) + 1 패턴을 먼저 외우고, Counter는 그 축약형으로 쓴다. Counter는 없는 키를 조회해도 0을 돌려준다.","code":"from collections import Counter\n\n\ndef count_items(items):\n    counter = {}\n    for x in items:\n        counter[x] = counter.get(x, 0) + 1\n    return counter\n\n\ndef most_common(items, n):\n    return Counter(items).most_common(n)","lv":2,"story":"무엇이 몇 번 나왔는지 세는 표준 방법이다. 직접 세는 방법을 먼저 알고, 그다음에 Counter 라는 지름길을 쓴다. 지름길만 외우면 응용이 안 된다.","where":"완주하지 못한 선수, 가장 많이 팔린 상품, 중복 찾기. 해시 문제의 기본형이다.","keys":["counter.get(x, 0) + 1 이 손으로 세는 표준 패턴이다","Counter 는 없는 키를 물어도 0을 준다","most_common(n) 은 많이 나온 순으로 n 개를 준다"],"walk":["Counter 를 쓰기 위해 불러온다. 파이썬에 기본 포함된 도구다.","직접 세는 함수다. Counter 없이 어떻게 되는지 먼저 본다.","세어 담을 빈 딕셔너리.","값을 하나씩 꺼낸다.","핵심 한 줄. get(x, 0) 은 \"있으면 그 값, 없으면 0\" 이라 첫 등장도 에러 없이 처리된다.","완성된 개수표를 돌려준다.","이번엔 지름길로 많이 나온 순 n 개를 구한다.","Counter 가 세기까지 대신 해준다. most_common(2) 면 상위 두 개가 (값, 횟수) 쌍으로 나온다."]},{"id":"py-string","cat":"파이썬 기본","title":"문자열 기본 조작","brief":"뒤집기, 자르기, 나누기, 붙이기, 치환.","limits":"길이 ≤ 100,000 / 슬라이싱은 O(N)","logic":"문자열은 바꿀 수 없으므로 모든 연산이 새 문자열을 만든다. 루프에서 += 로 이어붙이면 느려지니 list에 모아 join 한다.","code":"def string_basics(s):\n    reversed_s = s[::-1]\n    words = s.split()\n    joined = \"-\".join(words)\n    no_space = s.replace(\" \", \"\")\n    head, tail = s[:3], s[-3:]\n    return reversed_s, words, joined, no_space, head, tail\n\n\ndef build_fast(chars):\n    parts = []\n    for ch in chars:\n        parts.append(ch.upper())\n    return \"\".join(parts)","lv":2,"story":"문자열을 나누고 합치고 바꾸는 네 가지 동작이다. 마지막 함수는 성능 이야기인데, 루프 안에서 문자열을 += 로 이어붙이면 왜 느려지는지에 대한 답이다.","where":"입력 파싱은 거의 다 split 이고, 출력 조립은 거의 다 join 이다. 대량 출력 시 join 을 모르면 시간 초과가 난다.","keys":["문자열은 바꿀 수 없어서 모든 연산이 새 문자열을 만든다","루프에서 += 로 이어붙이면 매번 새로 만들어 느리다","list 에 모아 join 하는 것이 정답이다"],"walk":["문자열 기본 연산을 모은 함수다.","[::-1] 은 거꾸로 읽으라는 뜻이다. 뒤집기의 표준 표현.","공백 기준으로 쪼개 리스트로 만든다. 괄호 안이 비면 공백이 기준이다.","리스트를 하나의 문자열로 합친다. 앞의 \"-\" 가 사이에 끼는 글자다.","공백을 빈 글자로 바꿔 없앤다. replace 는 바꿀 것과 바꿀 대상 순서다.","앞 세 글자와 뒤 세 글자를 잘라 한 줄에 두 변수로 받는다.","여섯 값을 돌려준다.","빠르게 문자열을 만드는 함수다.","조각을 모을 리스트를 준비한다.","글자를 하나씩 꺼낸다.","문자열에 바로 += 하지 않고 리스트에 쌓는다. 이게 속도의 차이를 만든다.","마지막에 한 번만 합친다. \"\" 로 합치면 사이에 아무것도 안 들어간다."]},{"id":"py-enumerate","cat":"파이썬 기본","title":"enumerate와 zip","brief":"인덱스와 값을 함께, 두 리스트를 나란히 순회한다.","limits":"range(len(x)) 대신 쓰는 습관을 들인다","logic":"enumerate(arr, start=1)로 번호를 1부터 시작할 수 있다. zip은 짧은 쪽에 맞춰 잘리므로 길이가 다르면 손실이 난다.","code":"def pair_up(names, scores):\n    result = []\n    for rank, (name, score) in enumerate(zip(names, scores), start=1):\n        result.append((rank, name, score))\n    return result\n\n\ndef unzip(pairs):\n    lefts, rights = zip(*pairs)\n    return list(lefts), list(rights)","lv":2,"story":"번호와 값을 동시에 꺼내는 enumerate, 두 리스트를 나란히 꺼내는 zip. range(len(arr)) 라고 쓰던 습관을 버리게 하는 두 도구다.","where":"순위 매기기, 두 배열 비교, 좌표 다루기. zip(*grid) 은 2차원 배열 뒤집기의 관용구다.","keys":["enumerate(arr, start=1) 로 번호를 1부터 시작할 수 있다","zip 은 짧은 쪽에 맞춰 잘린다. 길이가 다르면 데이터가 손실된다","zip(*pairs) 는 묶인 것을 다시 푸는 역연산이다"],"walk":["이름과 점수를 순위와 함께 묶는 함수다.","결과를 담을 리스트.","zip 으로 이름·점수를 한 쌍씩 꺼내고, enumerate 로 거기에 번호를 붙인다. start=1 이라 1등부터 시작한다.","세 값을 묶어 담는다.","완성된 목록을 돌려준다.","묶인 쌍을 다시 두 리스트로 푸는 함수다.","* 는 \"묶음을 풀어서 각각 넘겨라\"는 뜻이다. zip 에 넘기면 열 단위로 재조립된다.","zip 결과는 튜플이라 list 로 감싸 돌려준다."]},{"id":"py-grid","cat":"파이썬 기본","title":"2차원 리스트 만들기","brief":"N×M 격자를 만들고 순회하고 뒤집는다.","limits":"N, M ≤ 1000","logic":"[[0] * m] * n 은 같은 행을 n번 참조해서 한 칸만 바꿔도 전부 바뀐다. 반드시 for 문으로 새 행을 만든다.","code":"def make_grid(n, m):\n    grid = [[0] * m for _ in range(n)]\n    for r in range(n):\n        for c in range(m):\n            grid[r][c] = r * m + c\n    return grid\n\n\ndef transpose(grid):\n    return [list(row) for row in zip(*grid)]","lv":2,"story":"2차원 격자를 만드는 법과, 초보가 반드시 한 번은 당하는 함정이다. [[0] * m] * n 은 같은 줄을 n 번 가리키기만 해서 한 칸만 바꿔도 전부 바뀐다.","where":"지도·미로·게임판 문제 전부. BFS·DFS 를 쓰려면 먼저 격자를 제대로 만들 줄 알아야 한다.","keys":["[[0] * m for _ in range(n)] 이 올바른 형태다","[[0] * m] * n 은 같은 행을 공유해서 틀린다","zip(*grid) 로 행과 열을 뒤집을 수 있다"],"walk":["n × m 격자를 만들어 번호를 채우는 함수다.","핵심 한 줄. for 로 매번 새 행을 만들어야 행끼리 독립된다.","행을 위에서부터 훑는다.","각 행 안에서 열을 훑는다. 이중 for 가 격자 순회의 기본형이다.","행 번호 × 가로 길이 + 열 번호로 일련번호를 채운다.","완성된 격자를 돌려준다.","행과 열을 뒤집는 함수다.","zip(*grid) 이 열 단위로 묶어준다. 각각 list 로 바꿔 리스트의 리스트로 만든다."]},{"id":"py-minmax","cat":"파이썬 기본","title":"최댓값과 그 위치","brief":"가장 큰 값, 그 인덱스, 상위 K개를 구한다.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"max(arr)로 값만 얻고 index()로 위치를 또 찾으면 두 번 훑는다. 한 번에 갱신하는 루프를 외운다.","code":"def max_with_index(nums):\n    best = 0\n    for i in range(1, len(nums)):\n        if nums[i] > nums[best]:\n            best = i\n    return nums[best], best\n\n\ndef top_k(nums, k):\n    return sorted(nums, reverse=True)[:k]","lv":2,"story":"가장 큰 값과 그 위치를 한 번의 순회로 찾는다. max(arr) 로 값을 얻고 index() 로 위치를 또 찾으면 배열을 두 번 훑게 된다. 한 번에 끝내는 습관을 들이는 코드다.","where":"최대·최소를 묻는 문제 전부. 그리디 문제에서 \"가장 큰 것부터\" 를 구현할 때 기본이 된다.","keys":["값과 위치가 둘 다 필요하면 직접 순회가 낫다","비교 기준을 인덱스로 들고 다니는 것이 요령이다","상위 K 개는 정렬 후 잘라내면 된다"],"walk":["최댓값과 그 위치를 함께 구하는 함수다.","일단 0번이 제일 크다고 가정하고 시작한다.","1번부터 비교하면 된다. 0번은 이미 기준이라 볼 필요가 없다.","지금 값이 기준보다 크면","기준을 이 위치로 바꾼다. 값이 아니라 위치를 들고 다니는 것이 요점이다.","값과 위치를 함께 돌려준다.","큰 것부터 K 개를 구하는 함수다.","내림차순 정렬 후 앞에서 K 개를 자른다. K 가 작으면 힙이 더 빠르지만 이 형태가 가장 단순하다."]},{"id":"py-sortbasic","cat":"파이썬 기본","title":"정렬 기본기","brief":"오름·내림차순, 길이순, 람다 키, 제자리 정렬의 차이.","limits":"N ≤ 1,000,000 / 시간 O(N log N)","logic":"sorted는 새 리스트를 돌려주고 .sort()는 제자리에서 바꾸며 None을 돌려준다. 이걸 헷갈려서 None이 튀어나오는 실수가 제일 잦다.","code":"def sort_basics(nums, words):\n    asc = sorted(nums)\n    desc = sorted(nums, reverse=True)\n    by_length = sorted(words, key=len)\n    by_last = sorted(words, key=lambda w: w[-1])\n    return asc, desc, by_length, by_last\n\n\ndef sort_in_place(nums):\n    nums.sort(reverse=True)\n    return nums","lv":2,"story":"정렬의 네 가지 형태와, None 이 튀어나오는 사고의 원인이다. sorted 는 새 리스트를 돌려주고 .sort() 는 제자리에서 바꾸며 아무것도 안 돌려준다.","where":"정렬은 코테의 전처리 단계 대부분에 들어간다. 그리디와 투포인터는 정렬이 선행돼야 성립한다.","keys":["sorted 는 새 리스트, .sort() 는 제자리 변경에 반환값 None","key 에 함수를 주면 그 결과를 기준으로 정렬한다","reverse=True 로 내림차순"],"walk":["정렬의 여러 형태를 모은 함수다.","기본은 오름차순이다. 원본 nums 는 그대로 남는다.","reverse=True 를 주면 내림차순이다.","key=len 은 \"길이를 기준으로\" 라는 뜻이다. 값 자체가 아니라 계산된 값으로 줄을 세운다.","lambda 는 이름 없는 즉석 함수다. 각 단어의 마지막 글자를 기준으로 삼는다.","네 결과를 돌려준다.","제자리 정렬을 보여주는 함수다.",".sort() 는 nums 자체를 바꾼다. 여기서 x = nums.sort() 라고 쓰면 x 는 None 이 된다.","바뀐 원본을 돌려준다."]},{"id":"sort-key","cat":"정렬","title":"다중 조건 정렬","brief":"나이는 오름차순, 나이가 같으면 이름은 가입순(입력 순서) 유지.","limits":"N ≤ 100000 / 시간 O(N log N)","logic":"파이썬 sort는 안정 정렬이라 동점은 입력 순서가 보존된다. 점수 내림차순 + 이름 오름차순처럼 방향이 섞이면 숫자는 -x로 뒤집고 문자열은 그대로 둔 채 튜플로 묶는다.","code":"def sort_members(members):\n    return sorted(members, key=lambda x: x[0])\n\n\ndef sort_mixed(items):\n    return sorted(items, key=lambda x: (-x[1], x[0]))","lv":3,"story":"정렬 기준이 두 개 이상일 때 쓰는 방법이다. key 에 튜플을 주면 앞의 것부터 비교하고 같으면 다음 것으로 넘어간다. 방향이 섞이면 숫자는 부호를 뒤집는다.","where":"\"점수 높은 순, 같으면 이름 가나다순\" 같은 조건이 붙는 모든 정렬 문제.","keys":["key 에 튜플을 주면 앞에서부터 순서대로 비교한다","내림차순이 섞이면 숫자는 -x, 문자열은 그대로 두고 단계를 나눈다","파이썬 정렬은 안정 정렬이라 동점은 입력 순서가 보존된다"],"walk":["나이 오름차순으로만 정렬하는 함수다.","x[0] 은 튜플의 첫 항목, 즉 나이다. 나이가 같으면 원래 순서가 유지된다.","점수 내림차순 + 이름 오름차순 함수다.","-x[1] 로 점수를 뒤집어 큰 것이 앞으로 오게 하고, 같으면 x[0] 즉 이름으로 비교한다."]},{"id":"py-divisor","cat":"파이썬 기본","title":"약수와 소수 판정","brief":"약수를 모두 구하고, 어떤 수가 소수인지 판정한다.","limits":"N ≤ 1,000,000,000 / 시간 O(√N)","logic":"i가 약수면 n//i도 약수다. 루프는 √N까지만 돌면 되고, i == n//i 인 제곱근은 한 번만 넣는다.","code":"def divisors(n):\n    res = []\n    i = 1\n    while i * i <= n:\n        if n % i == 0:\n            res.append(i)\n            if i != n // i:\n                res.append(n // i)\n        i += 1\n    return sorted(res)\n\n\ndef is_prime(n):\n    if n < 2:\n        return False\n    i = 2\n    while i * i <= n:\n        if n % i == 0:\n            return False\n        i += 1\n    return True","lv":3,"story":"약수를 √N 까지만 훑어 구하는 방법이다. i 가 약수면 n//i 도 약수라는 성질을 쓴다. N 까지 다 훑으면 10억짜리 수에서 시간 초과가 나지만 √N 이면 3만 번이면 끝난다.","where":"약수 개수, 소수 판정, 완전수 문제. 숫자 하나를 분해하는 모든 문제의 기본기다.","keys":["i 가 약수면 n // i 도 약수다. 그래서 √N 까지만 보면 된다","i * i <= n 으로 쓰면 제곱근 계산 없이 안전하다","제곱근인 경우(i == n // i)는 한 번만 넣어야 중복이 안 생긴다"],"walk":["약수를 전부 구하는 함수다.","결과를 담을 리스트.","1부터 시작한다.","i 의 제곱이 n 이하인 동안만 돈다. math.sqrt 를 안 쓰는 이유는 소수점 오차를 피하려고다.","나누어떨어지면 약수다.","작은 쪽 약수를 넣는다.","짝이 되는 큰 쪽이 자기 자신과 다를 때만. 36 의 6 처럼 제곱근이면 같아서 중복된다.","큰 쪽 약수를 넣는다. 이 한 줄 덕에 √N 까지만 봐도 전부 구해진다.","다음 수로 넘어간다.","순서가 섞여 있으니 정렬해서 돌려준다.","소수인지 판정하는 함수다.","2보다 작으면 소수가 아니다. 0과 1을 걸러내는 필수 예외 처리.","거짓을 돌려주고 끝.","2부터 나눠본다.","여기도 √N 까지만 본다.","하나라도 나누어떨어지면","소수가 아니다.","다음 수로.","끝까지 안 나눠졌으면 소수다."]},{"id":"py-base","cat":"파이썬 기본","title":"진법 변환","brief":"10진수를 n진수 문자열로, n진수 문자열을 10진수로.","limits":"2 ≤ base ≤ 16","logic":"나머지를 앞에 붙이며 몫으로 내려간다. 0은 루프를 한 번도 안 도니 따로 처리한다. 반대 방향은 int(s, base) 한 줄.","code":"def to_base(n, base):\n    if n == 0:\n        return \"0\"\n    digits = \"0123456789ABCDEF\"\n    res = \"\"\n    while n > 0:\n        res = digits[n % base] + res\n        n //= base\n    return res\n\n\ndef from_base(s, base):\n    return int(s, base)","lv":3,"story":"10진수를 다른 진법으로 바꾸는 방법이다. 나머지를 앞에 붙이며 몫으로 내려간다. 0은 while 을 한 번도 안 도니 따로 처리해야 한다는 게 함정이다.","where":"2진수 변환, 3진법 뒤집기 같은 구현 문제. 비트마스킹을 이해할 때도 바탕이 된다.","keys":["나머지를 앞에 붙이며 몫으로 내려간다","0은 루프를 한 번도 돌지 않으니 따로 처리한다","반대 방향은 int(s, base) 한 줄로 끝난다"],"walk":["n 을 base 진법 문자열로 바꾸는 함수다.","0은 아래 루프를 안 돌아 빈 문자열이 나온다. 그래서 먼저 걸러낸다.","\"0\" 을 돌려주고 끝.","숫자에 대응하는 글자표다. 10 이면 A, 15 면 F.","결과를 쌓을 빈 문자열.","n 이 0이 될 때까지.","나머지에 해당하는 글자를 앞에 붙인다. 뒤가 아니라 앞이다.","몫으로 내려간다. //= 는 n = n // base 의 줄임말.","완성된 문자열을 돌려준다.","반대 방향 함수다.","int 에 두 번째 인자를 주면 그 진법으로 읽어준다. 직접 구현할 필요가 없다."]},{"id":"py-input","cat":"파이썬 기본","title":"입력 받기 기본형","brief":"개수, 한 줄 여러 수, 격자, 문자열 여러 줄을 읽는다.","limits":"입력 100,000줄 이상이면 반드시 readline","logic":"실제 제출에서는 파일 맨 위에 input = sys.stdin.readline 한 줄을 넣는다. readline은 개행이 붙어 오므로 문자열은 rstrip()이 필수.","code":"import sys\n\n\ndef read_input():\n    readline = sys.stdin.readline\n    n = int(readline())\n    nums = list(map(int, readline().split()))\n    grid = [list(map(int, readline().split())) for _ in range(n)]\n    words = [readline().rstrip() for _ in range(n)]\n    return n, nums, grid, words","lv":3,"story":"입력이 많을 때 쓰는 빠른 읽기다. 기본 input() 은 줄 수가 10만을 넘으면 그것만으로 시간 초과가 난다. readline 으로 바꾸는 한 줄이 통과와 실패를 가른다.","where":"N 이 큰 모든 문제. 실제 제출에서는 파일 맨 위에 input = sys.stdin.readline 을 적어둔다.","keys":["입력 10만 줄이 넘으면 readline 이 필수다","readline 은 개행이 붙어 오므로 문자열은 rstrip() 해야 한다","숫자로 바꿀 땐 int 가 알아서 공백을 무시해 rstrip 이 없어도 된다"],"walk":["sys 를 불러온다. 표준 입력에 직접 접근하기 위해서다.","여러 형태를 한 번에 읽는 함수다.","매번 sys.stdin.readline 을 쓰면 기니까 짧은 이름에 담아둔다.","한 줄을 읽어 정수로 바꾼다.","한 줄의 여러 수를 리스트로 받는다.","n 줄을 읽어 격자를 만든다. 컴프리헨션 안에서 n 번 반복된다.","문자열은 rstrip() 이 필수다. 안 하면 끝에 개행이 붙어 비교가 전부 어긋난다.","읽은 것들을 돌려준다."]},{"id":"lv-hash-pair","cat":"해시","title":"해시로 짝 안 맞는 하나 찾기","brief":"두 목록을 비교해 한쪽에만 있는 원소를 찾는다. 동명이인 있음.","limits":"N ≤ 100,000 / 시간 O(N)","logic":"정렬해서 비교하면 O(N log N), 카운터로 빼면 O(N). 중복이 있으니 set으로 풀면 틀린다.","code":"from collections import Counter\n\n\ndef find_missing(left, right):\n    counter = Counter(left)\n    for name in right:\n        counter[name] -= 1\n    for name, cnt in counter.items():\n        if cnt > 0:\n            return name\n    return \"\"","lv":3,"story":"두 목록을 비교해 한쪽에만 있는 것을 찾는다. 정렬해서 비교하면 N log N 이지만 개수를 세서 빼면 N 으로 끝난다. 동명이인이 있어서 set 으로 풀면 틀린다.","where":"완주하지 못한 선수 유형. 중복이 있는 비교 문제의 표준 해법이다.","keys":["한쪽을 세어두고 다른 쪽을 돌며 1씩 뺀다","0이 안 된 것이 남은 하나다","중복이 있으므로 set 으로 풀면 틀린다"],"walk":["Counter 를 불러온다.","한쪽에만 있는 하나를 찾는 함수다.","왼쪽 목록의 개수를 전부 센다.","오른쪽 목록을 하나씩 돌며","해당 이름의 개수를 1 줄인다. 짝이 맞으면 0이 된다.","이름과 남은 개수를 하나씩 꺼낸다.","0보다 크면 짝이 안 맞은 것이다.","그 이름을 돌려준다.","전부 짝이 맞았으면 빈 문자열. 방어 코드다."]},{"id":"lv-double-loop","cat":"완전탐색","title":"이중 반복 완전탐색","brief":"모든 두 원소 쌍을 확인해 조건을 만족하는 최선을 찾는다.","limits":"N ≤ 2,000 / 시간 O(N²)","logic":"i < j 를 지키려고 안쪽 루프를 i+1부터 시작한다. N이 3,000을 넘어가면 이 방식은 버리고 정렬+투포인터로 바꾼다.","code":"def best_pair(nums, limit):\n    best = -1\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            total = nums[i] + nums[j]\n            if total <= limit and total > best:\n                best = total\n    return best","lv":3,"story":"모든 두 원소 쌍을 빠짐없이 확인한다. 가장 단순하고 가장 확실한 방법이지만 N 이 3천을 넘으면 900만 번이라 느려진다. 한계를 알고 쓰는 것이 중요하다.","where":"두 수의 합, 가장 가까운 쌍 같은 문제. N 이 작으면 이게 정답이고 크면 정렬+투포인터로 바꾼다.","keys":["안쪽 루프를 i + 1 부터 시작해 같은 쌍을 두 번 세지 않는다","N이 2천이면 200만 번, 3천을 넘어가면 다른 방법을 찾는다","최선값을 담는 변수는 절대 안 나올 값으로 초기화한다"],"walk":["한도 이하인 두 수의 합 중 최대를 찾는 함수다.","-1 로 시작한다. 실제 답이 될 수 없는 값이어야 \"못 찾음\"과 구분된다.","첫 번째 원소를 고른다.","두 번째는 i 다음부터. 이렇게 해야 (1,2) 와 (2,1) 을 중복해서 보지 않는다.","두 수를 더한다.","한도 이하이면서 지금까지의 최선보다 큰지 본다.","최선을 갱신한다.","결과를 돌려준다. 못 찾았으면 -1 그대로다."]},{"id":"lv-prefix","cat":"누적합","title":"누적합으로 구간 합","brief":"구간 합 질의가 여러 번 들어올 때 매번 더하지 않는다.","limits":"N, Q ≤ 100,000 / 전처리 O(N), 질의 O(1)","logic":"prefix[i+1] = prefix[i] + nums[i] 로 한 칸 밀어서 만든다. 구간 [l, r] 합은 prefix[r+1] - prefix[l]. 밀어놓는 이유가 l=0 예외를 없애기 위해서다.","code":"def build_prefix(nums):\n    prefix = [0] * (len(nums) + 1)\n    for i, x in enumerate(nums):\n        prefix[i + 1] = prefix[i] + x\n    return prefix\n\n\ndef range_sum(prefix, left, right):\n    return prefix[right + 1] - prefix[left]","lv":3,"story":"구간 합을 여러 번 물어볼 때 매번 더하지 않는 방법이다. 앞에서부터 누적한 표를 미리 만들어두면 어떤 구간이든 뺄셈 한 번으로 답이 나온다.","where":"구간 합 질의, 부분 배열 문제. 질의가 10만 개면 미리 만들지 않으면 100억 번 연산이 된다.","keys":["prefix[i+1] = prefix[i] + nums[i] 로 한 칸 밀어서 만든다","한 칸 미는 이유는 left = 0 인 경우의 예외를 없애기 위해서다","구간 [l, r] 의 합은 prefix[r+1] - prefix[l]"],"walk":["누적합 표를 만드는 함수다.","원본보다 한 칸 길게 만든다. 맨 앞의 0이 경계 처리를 대신해준다.","번호와 값을 함께 꺼낸다.","i+1 칸에 \"여기까지의 합\"을 적는다. 한 칸 밀린 것이 핵심이다.","완성된 표를 돌려준다.","구간 합을 묻는 함수다.","뺄셈 한 번이면 끝난다. 구간이 아무리 길어도 시간이 같다."]},{"id":"lv-greedy-coin","cat":"그리디","title":"그리디 거스름돈","brief":"큰 단위부터 최대한 쓰며 금액을 맞춘다.","limits":"동전 ≤ 100 / 시간 O(N)","logic":"동전 단위가 서로 배수 관계일 때만 그리디가 최적이다. 아니면 DP(동전 교환)로 가야 한다. 이 구분이 함정.","code":"def make_change(amount, coins):\n    coins = sorted(coins, reverse=True)\n    used = []\n    for coin in coins:\n        cnt = amount // coin\n        if cnt:\n            used.append((coin, cnt))\n            amount -= coin * cnt\n    return used if amount == 0 else []","lv":3,"story":"큰 단위부터 최대한 쓰는 것이 항상 최적인 경우의 풀이다. 다만 그게 항상 최적은 아니다. 동전 단위가 서로 배수 관계일 때만 성립하고, 아니면 DP로 가야 한다.","where":"거스름돈, 회의실 배정 같은 그리디 문제. 그리디가 되는지 아닌지를 판별하는 것이 진짜 실력이다.","keys":["동전 단위가 서로 배수 관계일 때만 그리디가 최적이다","예: 500/100/50/10 은 성립하지만 1/3/4 는 안 된다","성립하지 않으면 동전 교환 DP로 가야 한다"],"walk":["금액을 동전으로 나누는 함수다.","큰 단위부터 보려고 내림차순 정렬한다. 이 순서가 그리디의 전부다.","사용 내역을 담을 리스트.","큰 동전부터 하나씩.","이 동전으로 몇 개를 낼 수 있는지 몫으로 구한다.","한 개라도 쓸 수 있으면.","동전과 개수를 기록한다.","쓴 만큼 금액에서 뺀다.","남은 금액이 0이어야 성공. 아니면 못 만든 것이니 빈 리스트를 돌려준다."]},{"id":"lv-greedy-meet","cat":"그리디","title":"최대 회의 개수","brief":"겹치지 않게 회의를 최대 몇 개 넣을 수 있는지.","limits":"N ≤ 100,000 / 시간 O(N log N)","logic":"끝나는 시간 기준 정렬이 핵심. 시작 시간으로 정렬하면 틀린다. 끝 시간이 같으면 시작 시간이 빠른 것을 앞에 둔다.","code":"def max_meetings(meetings):\n    meetings = sorted(meetings, key=lambda x: (x[1], x[0]))\n    count = 0\n    last_end = float(\"-inf\")\n    for start, end in meetings:\n        if start >= last_end:\n            count += 1\n            last_end = end\n    return count","lv":3,"story":"겹치지 않게 회의를 최대한 많이 넣는 문제다. 답은 \"빨리 끝나는 것부터\" 고르는 것인데, 시작 시간 기준으로 정렬하면 틀린다는 것이 이 문제의 전부다.","where":"회의실 배정, 강의실 배정 유형. 그리디 증명 연습으로 가장 자주 나오는 문제다.","keys":["끝나는 시간 기준 정렬이 정답이다. 시작 시간 기준은 틀린다","빨리 끝날수록 뒤에 남는 시간이 많다는 것이 이유다","끝 시간이 같으면 시작이 빠른 것을 앞에 둔다"],"walk":["최대 회의 개수를 세는 함수다.","끝나는 시간(x[1])이 1순위, 시작 시간(x[0])이 2순위다. 이 한 줄이 정답의 핵심.","센 개수.","마지막 회의가 끝난 시각. 처음에는 무한히 과거로 둔다.","정렬된 순서대로 하나씩.","앞 회의가 끝난 뒤에 시작하면 넣을 수 있다.","개수를 올리고","끝난 시각을 갱신한다.","결과를 돌려준다."]},{"id":"lv-window-fixed","cat":"투포인터","title":"고정 길이 슬라이딩 윈도우","brief":"길이 K인 연속 구간 합의 최댓값.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"매번 sum을 다시 부르면 O(NK)가 된다. 들어온 것을 더하고 나간 것을 빼는 한 줄이 전부.","code":"def max_window_sum(nums, k):\n    total = sum(nums[:k])\n    best = total\n    for i in range(k, len(nums)):\n        total += nums[i] - nums[i - k]\n        if total > best:\n            best = total\n    return best","lv":3,"story":"길이가 고정된 창을 한 칸씩 밀면서 합을 갱신한다. 매번 sum 을 다시 부르면 N × K 가 되지만, 들어온 것을 더하고 나간 것을 빼면 N 으로 끝난다.","where":"연속 K 일의 최대 매출, 고정 길이 부분 배열 문제. 투포인터의 가장 단순한 형태다.","keys":["매번 sum 을 다시 부르면 O(NK) 가 된다","들어온 것을 더하고 나간 것을 빼는 한 줄이 전부다","첫 창의 합만 미리 구해두면 된다"],"walk":["길이 k 구간의 최대 합을 구하는 함수다.","첫 번째 창의 합만 직접 구한다. 여기서만 sum 을 쓴다.","일단 첫 창을 최선으로 둔다.","k 번째부터 오른쪽 끝을 한 칸씩 민다.","핵심 한 줄. 새로 들어온 nums[i] 를 더하고, 빠져나간 nums[i-k] 를 뺀다.","갱신할 값이면","최선을 바꾼다.","결과를 돌려준다."]},{"id":"lv-deque","cat":"자료구조","title":"덱으로 순환 처리","brief":"줄을 돌리거나, 정해진 간격으로 하나씩 빼낸다.","limits":"N ≤ 100,000 / 시간 O(N·K)","logic":"list.pop(0)는 O(N)이라 큐로 쓰면 안 된다. deque.rotate(-k)는 왼쪽으로 k칸, 양수는 오른쪽으로 민다.","code":"from collections import deque\n\n\ndef rotate_left(items, k):\n    q = deque(items)\n    q.rotate(-k)\n    return list(q)\n\n\ndef round_robin(items, step):\n    q = deque(items)\n    order = []\n    while q:\n        q.rotate(-(step - 1))\n        order.append(q.popleft())\n    return order","lv":3,"story":"양쪽 끝에서 넣고 빼는 자료구조다. 리스트로 큐를 흉내 내면 pop(0) 이 O(N) 이라 느려진다. deque 는 양쪽 다 O(1) 이다.","where":"BFS 의 큐가 전부 deque 다. 요세푸스 문제, 회전 문제도 여기서 나온다.","keys":["list.pop(0) 은 O(N) 이라 큐로 쓰면 안 된다","deque 는 양쪽 끝 모두 O(1) 이다","rotate(-k) 는 왼쪽으로 k 칸, 양수는 오른쪽으로 민다"],"walk":["deque 를 불러온다.","왼쪽으로 k 칸 미는 함수다.","리스트를 deque 로 바꾼다.","음수면 왼쪽으로 민다. 맨 앞 k 개가 뒤로 넘어간다.","다시 리스트로 바꿔 돌려준다.","정해진 간격으로 하나씩 빼내는 함수다. 요세푸스 문제의 형태다.","deque 로 변환.","빠진 순서를 담을 리스트.","큐가 빌 때까지.","뽑을 차례가 맨 앞에 오도록 step-1 칸만큼 돌린다.","맨 앞을 빼서 기록한다. popleft 가 O(1) 인 것이 이 자료구조를 쓰는 이유다.","빠진 순서를 돌려준다."]},{"id":"lv-set","cat":"해시","title":"집합 연산","brief":"교집합, 합집합, 차집합, 중복 제거.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"set은 순서를 보장하지 않으므로 출력이 필요하면 sorted를 씌운다. in 검사가 리스트는 O(N), set은 O(1)인 게 핵심 이유.","code":"def set_ops(a, b):\n    sa, sb = set(a), set(b)\n    common = sorted(sa & sb)\n    merged = sorted(sa | sb)\n    only_a = sorted(sa - sb)\n    return common, merged, only_a, len(sa)","lv":3,"story":"중복 없는 모음이다. 리스트에서 값이 있는지 확인하면 전부 훑어야 하지만 집합은 한 번에 찾는다. 이 속도 차이가 집합을 쓰는 진짜 이유다.","where":"중복 제거, 방문 여부 확인, 공통 원소 찾기. \"이미 본 적 있나?\" 를 묻는 모든 곳.","keys":["in 검사가 리스트는 O(N), 집합은 O(1) 이다","& 교집합, | 합집합, - 차집합","순서를 보장하지 않으니 출력이 필요하면 sorted 를 씌운다"],"walk":["두 목록의 집합 연산을 모은 함수다.","리스트를 집합으로 바꾼다. 이 순간 중복이 사라진다.","& 는 양쪽에 다 있는 것이다. 순서가 없으니 sorted 로 정리한다.","| 는 둘을 합친 것. 중복은 하나로 합쳐진다.","- 는 a 에만 있는 것이다.","결과와 a 의 중복 제거 후 개수를 돌려준다."]},{"id":"sim-rotate","cat":"구현","title":"2차원 배열 90도 회전","brief":"N×M 격자를 시계 방향으로 90도 돌린 결과를 반환한다.","limits":"N, M ≤ 1000 / 시간 O(NM)","logic":"zip(*grid[::-1])이 시계, zip(*grid)[::-1]이 반시계. 인덱스로 직접 쓸 때는 new[c][N-1-r] = grid[r][c].","code":"def rotate(grid):\n    n, m = len(grid), len(grid[0])\n    new = [[0] * n for _ in range(m)]\n    for r in range(n):\n        for c in range(m):\n            new[c][n - 1 - r] = grid[r][c]\n    return new","lv":4,"story":"격자를 시계 방향으로 90도 돌린다. 어느 칸이 어디로 가는지 인덱스 대응만 정확히 외우면 끝난다.","where":"종이접기, 도형 회전, 퍼즐 맞추기 유형. 회전이 섞인 시뮬레이션 문제의 부품으로 자주 들어간다.","keys":["new[c][n-1-r] = grid[r][c] 가 시계 방향","행과 열이 뒤바뀌므로 결과의 크기는 m × n 이다","zip(*grid[::-1]) 로 한 줄에 쓸 수도 있다"]},{"id":"sim-spiral","cat":"구현","title":"나선형 채우기","brief":"N×N 격자를 바깥에서 안으로 돌며 1부터 N*N까지 채운다.","limits":"N ≤ 500 / 시간 O(N²)","logic":"방향 배열 4개를 순서대로 두고, 벽이나 이미 채운 칸을 만나면 방향을 한 칸 돌린다.","code":"def spiral(n):\n    grid = [[0] * n for _ in range(n)]\n    dr, dc = [0, 1, 0, -1], [1, 0, -1, 0]\n    r = c = d = 0\n    for v in range(1, n * n + 1):\n        grid[r][c] = v\n        nr, nc = r + dr[d], c + dc[d]\n        if not (0 <= nr < n and 0 <= nc < n) or grid[nr][nc]:\n            d = (d + 1) % 4\n            nr, nc = r + dr[d], c + dc[d]\n        r, c = nr, nc\n    return grid","lv":4,"story":"바깥에서 안으로 돌며 격자를 채운다. 벽이나 이미 채운 칸을 만나면 방향을 한 칸 돌린다.","where":"달팽이 배열 만들기 유형. 방향 전환 시뮬레이션의 가장 기본 형태다.","keys":["방향 배열 4개를 시계 순서로 둔다","막히면 (d + 1) % 4 로 방향을 돌린다","이미 채운 칸인지 검사하는 것이 벽 검사와 같은 역할을 한다"]},{"id":"bf-comb","cat":"완전탐색","title":"조합 완전탐색","brief":"N개 중 M개를 고르는 모든 경우를 사전순으로 만든다.","limits":"N ≤ 20 / 시간 O(C(N,M)·M)","logic":"시작 인덱스를 넘겨 중복을 막는다. 재귀 깊이 == 고른 개수.","code":"def combinations(arr, m):\n    res = []\n    path = []\n\n    def back(start):\n        if len(path) == m:\n            res.append(path[:])\n            return\n        for i in range(start, len(arr)):\n            path.append(arr[i])\n            back(i + 1)\n            path.pop()\n\n    back(0)\n    return res","lv":4,"story":"N개 중 M개를 고르는 모든 경우를 만든다. 순서는 상관없고 조합만 다르면 다른 경우다.","where":"로또 번호, 팀 짜기, 부분집합 문제. itertools 로도 되지만 조건을 걸어 가지치기하려면 직접 짜야 한다.","keys":["시작 인덱스를 넘겨 중복을 막는다","재귀 깊이가 곧 고른 개수다","path.pop() 으로 되돌리는 것이 백트래킹의 핵심"]},{"id":"bf-perm","cat":"완전탐색","title":"순열 완전탐색","brief":"N개 중 M개를 뽑아 나열하는 모든 순서를 만든다.","limits":"N ≤ 10 / 시간 O(P(N,M)·M)","logic":"used 배열로 이미 쓴 원소를 막는다. 조합과 달리 매번 0부터 훑는다.","code":"def permutations(arr, m):\n    res = []\n    path = []\n    used = [False] * len(arr)\n\n    def back():\n        if len(path) == m:\n            res.append(path[:])\n            return\n        for i in range(len(arr)):\n            if used[i]:\n                continue\n            used[i] = True\n            path.append(arr[i])\n            back()\n            path.pop()\n            used[i] = False\n\n    back()\n    return res","lv":4,"story":"N개 중 M개를 뽑아 나열하는 모든 순서를 만든다. 조합과 달리 순서가 다르면 다른 경우다.","where":"N-Queen, 외판원 순회, 순서가 중요한 배치 문제. N이 10을 넘으면 감당이 안 되니 DP로 바꿔야 한다.","keys":["used 배열로 이미 쓴 원소를 막는다","조합과 달리 매번 0부터 다시 훑는다","경우의 수가 팩토리얼로 늘어난다는 것을 늘 의식한다"]},{"id":"sort-count","cat":"정렬","title":"계수 정렬","brief":"값의 범위가 작은 대량의 수를 정렬한다.","limits":"N ≤ 10,000,000 / 값 ≤ 10,000 / 시간 O(N+K)","logic":"값 자체를 인덱스로 쓴다. 비교 정렬의 N log N 하한을 우회하는 유일한 경우.","code":"def counting_sort(arr, max_value):\n    count = [0] * (max_value + 1)\n    for x in arr:\n        count[x] += 1\n    res = []\n    for v in range(max_value + 1):\n        res.extend([v] * count[v])\n    return res","lv":4,"story":"값의 범위가 좁고 개수가 많을 때 값 자체를 인덱스로 써서 세는 정렬이다.","where":"1천만 개의 수를 정렬하라는 문제. 비교 정렬의 N log N 하한을 우회하는 유일한 경우다.","keys":["값을 인덱스로 쓰므로 값 범위만큼 배열이 필요하다","시간은 O(N + K) 로 선형이다","값 범위가 넓으면 메모리가 터진다"]},{"id":"bs-basic","cat":"이분탐색","title":"이분탐색 기본형","brief":"정렬된 배열에서 target의 인덱스를 찾고 없으면 -1.","limits":"N ≤ 1,000,000 / 시간 O(log N)","logic":"while lo <= hi, mid = (lo+hi)//2. 경계 조건은 항상 lo <= hi와 hi = mid-1 / lo = mid+1 한 쌍으로 외운다.","code":"def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n            return mid\n        if arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1","lv":4,"story":"정렬된 데이터에서 절반씩 버리며 찾는다. 100만 개에서 20번이면 찾는다.","where":"정렬이 되어 있거나 정렬할 수 있는 모든 탐색 문제. 파라메트릭 서치의 바탕이기도 하다.","keys":["while lo <= hi 와 hi = mid - 1 / lo = mid + 1 을 한 쌍으로 외운다","반드시 정렬되어 있어야 성립한다","경계 조건이 틀리면 무한 루프가 난다"]},{"id":"tp-window","cat":"투포인터","title":"합이 S 이상인 최소 길이","brief":"양수 배열에서 부분합이 S 이상이 되는 가장 짧은 연속 구간의 길이.","limits":"N ≤ 100,000 / 시간 O(N)","logic":"오른쪽을 한 칸씩 늘려 합을 키우고, 조건을 만족하는 동안 왼쪽을 당겨 최솟값을 갱신한다. 양수 배열에서만 성립.","code":"def min_window(arr, s):\n    left = 0\n    total = 0\n    best = len(arr) + 1\n    for right in range(len(arr)):\n        total += arr[right]\n        while total >= s:\n            best = min(best, right - left + 1)\n            total -= arr[left]\n            left += 1\n    return best if best <= len(arr) else 0","lv":4,"story":"조건을 만족하는 가장 짧은 연속 구간을 찾는다. 오른쪽을 늘려 조건을 만족시키고 왼쪽을 당겨 줄인다.","where":"부분합이 S 이상인 최소 길이 유형. 양수 배열에서만 성립하는 것이 중요한 제약이다.","keys":["오른쪽으로 늘리고 조건을 만족하는 동안 왼쪽을 당긴다","양수 배열에서만 성립한다","각 원소가 최대 두 번만 방문되므로 O(N) 이다"]},{"id":"tp-pair","cat":"투포인터","title":"두 수의 합","brief":"정렬된 배열에서 합이 정확히 target인 쌍의 개수.","limits":"N ≤ 100,000 / 시간 O(N log N)","logic":"양 끝에서 좁혀온다. 합이 작으면 왼쪽을 밀고 크면 오른쪽을 당긴다. 중복 값이 있으면 같은 값 묶음 개수를 곱한다.","code":"def count_pairs(arr, target):\n    arr = sorted(arr)\n    lo, hi = 0, len(arr) - 1\n    cnt = 0\n    while lo < hi:\n        total = arr[lo] + arr[hi]\n        if total == target:\n            cnt += 1\n            lo += 1\n            hi -= 1\n        elif total < target:\n            lo += 1\n        else:\n            hi -= 1\n    return cnt","lv":4,"story":"정렬된 배열의 양 끝에서 좁혀오며 합이 목표인 쌍을 찾는다. 이중 반복의 O(N²) 을 O(N) 으로 줄인다.","where":"두 수의 합, 세 수의 합 문제. 세 수는 하나를 고정하고 나머지를 투포인터로 푼다.","keys":["합이 작으면 왼쪽을 밀고 크면 오른쪽을 당긴다","정렬이 선행되어야 한다","중복 값이 있으면 같은 값 묶음 개수를 곱해야 한다"]},{"id":"st-bracket","cat":"자료구조","title":"괄호 유효성 검사","brief":"(), [], {} 가 올바르게 짝지어졌는지 판정한다.","limits":"길이 ≤ 100,000 / 시간 O(N)","logic":"여는 괄호는 push, 닫는 괄호는 top과 짝이 맞는지 확인 후 pop. 마지막에 스택이 비어야 참.","code":"def is_valid(s):\n    pair = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pair:\n            if not stack or stack[-1] != pair[ch]:\n                return False\n            stack.pop()\n    return not stack","lv":4,"story":"여는 괄호는 쌓고 닫는 괄호는 짝을 맞춰 꺼낸다. 마지막에 스택이 비어야 올바른 괄호다.","where":"괄호 검사, 수식 계산, 태그 검증. 스택이 왜 필요한지를 가장 명확하게 보여주는 문제다.","keys":["여는 것은 push, 닫는 것은 top 과 짝이 맞는지 보고 pop","마지막에 스택이 비어야 참이다","스택이 비었는데 닫는 괄호가 오면 즉시 거짓"]},{"id":"dfs-cc","cat":"DFS","title":"연결 요소 개수와 크기","brief":"무방향 그래프에서 연결 요소의 개수와 각 크기를 구한다.","limits":"N ≤ 100,000 / 시간 O(N+E)","logic":"재귀 대신 스택으로 돌린다. 파이썬은 재귀 깊이 제한(기본 1000)에 걸리기 쉬워 반복형이 안전하다.","code":"def connected_components(n, graph):\n    visited = [False] * n\n    sizes = []\n    for s in range(n):\n        if visited[s]:\n            continue\n        visited[s] = True\n        stack = [s]\n        size = 0\n        while stack:\n            cur = stack.pop()\n            size += 1\n            for nxt in graph[cur]:\n                if not visited[nxt]:\n                    visited[nxt] = True\n                    stack.append(nxt)\n        sizes.append(size)\n    return len(sizes), sizes","lv":4,"story":"그래프에서 서로 이어진 덩어리가 몇 개인지, 각각 크기가 얼마인지 센다.","where":"섬의 개수, 친구 관계 묶기, 네트워크 연결 확인. 그래프 문제의 입문이다.","keys":["방문 배열이 곧 중복 방지다","파이썬은 재귀 깊이 제한이 있어 반복형 스택이 안전하다","큐로 바꾸면 그대로 BFS 가 된다"]},{"id":"bfs-grid","cat":"BFS","title":"격자 최단거리","brief":"0은 벽, 1은 길인 격자에서 (0,0)부터 (N-1,M-1)까지 최소 칸 수.","limits":"N, M ≤ 1000 / 시간 O(NM)","logic":"dist 배열 하나로 방문 표시와 거리를 동시에 관리한다. 큐에 넣을 때 방문 처리해야 중복 삽입이 없다.","code":"from collections import deque\n\n\ndef shortest_path(grid):\n    n, m = len(grid), len(grid[0])\n    dist = [[0] * m for _ in range(n)]\n    dr, dc = [-1, 1, 0, 0], [0, 0, -1, 1]\n    q = deque([(0, 0)])\n    dist[0][0] = 1\n    while q:\n        r, c = q.popleft()\n        if (r, c) == (n - 1, m - 1):\n            return dist[r][c]\n        for d in range(4):\n            nr, nc = r + dr[d], c + dc[d]\n            if 0 <= nr < n and 0 <= nc < m and grid[nr][nc] == 1 and dist[nr][nc] == 0:\n                dist[nr][nc] = dist[r][c] + 1\n                q.append((nr, nc))\n    return -1","lv":4,"story":"격자에서 최단 거리를 구한다. 가중치가 없는 그래프의 최단 거리는 BFS 가 정답이다.","where":"미로 탈출, 최소 이동 횟수. 코테에서 가장 출제 빈도가 높은 유형이라고 봐도 된다.","keys":["dist 배열 하나로 방문 표시와 거리를 동시에 관리한다","큐에 넣을 때 방문 처리해야 중복 삽입이 없다","가중치가 있으면 BFS 로는 안 되고 다익스트라로 가야 한다"]},{"id":"bfs-multi","cat":"BFS","title":"다중 시작점 BFS","brief":"여러 시작점에서 동시에 퍼질 때 전부 채우는 데 걸리는 날짜. 못 채우면 -1.","limits":"N, M ≤ 1000 / 시간 O(NM)","logic":"시작점을 전부 큐에 미리 넣고 한 번만 BFS를 돌린다. 시작점마다 따로 돌리면 시간 초과.","code":"from collections import deque\n\n\ndef spread_days(grid):\n    n, m = len(grid), len(grid[0])\n    q = deque()\n    fresh = 0\n    for r in range(n):\n        for c in range(m):\n            if grid[r][c] == 1:\n                q.append((r, c, 0))\n            elif grid[r][c] == 0:\n                fresh += 1\n    dr, dc = [-1, 1, 0, 0], [0, 0, -1, 1]\n    days = 0\n    while q:\n        r, c, d = q.popleft()\n        days = d\n        for i in range(4):\n            nr, nc = r + dr[i], c + dc[i]\n            if 0 <= nr < n and 0 <= nc < m and grid[nr][nc] == 0:\n                grid[nr][nc] = 1\n                fresh -= 1\n                q.append((nr, nc, d + 1))\n    return days if fresh == 0 else -1","lv":4,"story":"여러 지점에서 동시에 퍼져나갈 때의 시간을 구한다. 시작점을 전부 큐에 미리 넣고 한 번만 돌린다.","where":"토마토 익히기, 불 번지기, 바이러스 확산. 시작점마다 따로 돌리면 반드시 시간 초과가 난다.","keys":["시작점을 전부 큐에 넣고 시작한다","시작점마다 따로 BFS 를 돌리면 시간 초과다","끝난 뒤 못 채운 칸이 남았는지 반드시 확인한다"]},{"id":"bt-subset","cat":"백트래킹","title":"부분수열의 합","brief":"수열에서 합이 S가 되는 부분수열의 개수 (공집합 제외).","limits":"N ≤ 20 / 시간 O(2^N)","logic":"각 원소마다 '쓴다 / 안 쓴다' 두 갈래로 내려간다. N이 40쯤 되면 반씩 나눠 푸는 meet-in-the-middle로 바꾼다.","code":"def count_subsets(arr, s):\n    n = len(arr)\n    count = 0\n\n    def back(i, total, picked):\n        nonlocal count\n        if i == n:\n            if picked and total == s:\n                count += 1\n            return\n        back(i + 1, total + arr[i], picked + 1)\n        back(i + 1, total, picked)\n\n    back(0, 0, 0)\n    return count","lv":4,"story":"각 원소를 쓸지 말지 두 갈래로 내려가며 모든 부분집합을 만든다.","where":"부분수열의 합, 동전 조합. N이 20이면 100만 경우로 감당되지만 40이면 반씩 나눠 푸는 기법이 필요하다.","keys":["각 원소마다 쓴다 / 안 쓴다 두 갈래","N이 20이면 약 100만 가지","N이 40쯤이면 meet-in-the-middle 로 바꾼다"]},{"id":"dp-stairs","cat":"DP","title":"계단 오르기 점화식","brief":"한 번에 1칸 또는 2칸 오를 때 N칸을 오르는 경우의 수.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"dp[i] = dp[i-1] + dp[i-2]. 모든 선형 DP의 원형이다. 초기값 두 개를 먼저 못 박고 시작한다.","code":"def climb(n):\n    if n <= 2:\n        return n\n    dp = [0] * (n + 1)\n    dp[1], dp[2] = 1, 2\n    for i in range(3, n + 1):\n        dp[i] = dp[i - 1] + dp[i - 2]\n    return dp[n]","lv":4,"story":"앞의 두 답을 더해 다음 답을 만든다. 모든 선형 DP 의 원형이다.","where":"계단 오르기, 타일링, 피보나치. DP 를 처음 배울 때 반드시 거쳐가는 문제다.","keys":["dp[i] = dp[i-1] + dp[i-2]","초기값 두 개를 먼저 못 박고 시작한다","점화식을 세우는 것이 DP 의 전부다"]},{"id":"dp-coin","cat":"DP","title":"동전 교환","brief":"동전 종류가 주어질 때 금액 K를 만드는 최소 동전 개수. 불가능하면 -1.","limits":"K ≤ 10,000 / 시간 O(NK)","logic":"INF로 초기화하고 dp[0]=0. 개수 최소화는 정순 순회(무한 개 사용 가능). 경우의 수를 셀 땐 루프 순서가 반대다.","code":"def min_coins(coins, target):\n    INF = float(\"inf\")\n    dp = [INF] * (target + 1)\n    dp[0] = 0\n    for coin in coins:\n        for amount in range(coin, target + 1):\n            dp[amount] = min(dp[amount], dp[amount - coin] + 1)\n    return dp[target] if dp[target] != INF else -1","lv":4,"story":"금액을 만드는 최소 동전 개수를 구한다. 그리디가 통하지 않는 동전 단위에서 쓰는 정답이다.","where":"거스름돈 최소 개수, 배낭 변형. 그리디와 DP 를 언제 갈라 써야 하는지 배우는 문제다.","keys":["INF 로 초기화하고 dp[0] = 0 으로 시작한다","개수 최소화는 정순 순회다","경우의 수를 셀 때는 루프 순서가 반대가 된다"]},{"id":"str-palin","cat":"문자열","title":"최장 팰린드롬 부분문자열","brief":"문자열에서 앞뒤가 같은 가장 긴 연속 구간.","limits":"길이 ≤ 2,000 / 시간 O(N²)","logic":"각 위치를 중심으로 양쪽으로 벌린다. 길이가 홀수인 경우와 짝수인 경우를 따로 돌려야 한다.","code":"def longest_palindrome(s):\n    best = \"\"\n\n    def expand(lo, hi):\n        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:\n            lo -= 1\n            hi += 1\n        return s[lo + 1:hi]\n\n    for i in range(len(s)):\n        odd = expand(i, i)\n        even = expand(i, i + 1)\n        for cand in (odd, even):\n            if len(cand) > len(best):\n                best = cand\n    return best","lv":4,"story":"각 위치를 중심으로 양쪽으로 벌리며 가장 긴 회문을 찾는다. 홀수 길이와 짝수 길이를 따로 봐야 한다.","where":"회문 판별, 가장 긴 팰린드롬 부분 문자열. 문자열 문제의 단골이다.","keys":["중심에서 양쪽으로 벌리는 방식","홀수 중심과 짝수 중심을 둘 다 돌려야 한다","O(N²) 이라 길이가 2천을 넘으면 다른 알고리즘이 필요하다"]},{"id":"math-sieve","cat":"수학","title":"에라토스테네스의 체","brief":"N 이하의 소수를 모두 구한다.","limits":"N ≤ 1,000,000 / 시간 O(N log log N)","logic":"i*i부터 지우기 시작하고 i는 √N까지만 본다. 슬라이스 대입으로 한 번에 지우면 훨씬 빠르다.","code":"def sieve(n):\n    is_prime = [True] * (n + 1)\n    is_prime[0] = is_prime[1] = False\n    i = 2\n    while i * i <= n:\n        if is_prime[i]:\n            is_prime[i * i::i] = [False] * len(is_prime[i * i::i])\n        i += 1\n    return [x for x in range(2, n + 1) if is_prime[x]]","lv":4,"story":"2부터 차례로 배수를 지워 남은 것이 소수다. 하나씩 소수 판정하는 것보다 훨씬 빠르다.","where":"N 이하 소수 전부 구하기. 소수가 여러 번 필요한 문제는 전부 체로 미리 만들어두고 시작한다.","keys":["i * i 부터 지우기 시작한다. 그 앞은 이미 지워졌다","i 는 √N 까지만 보면 된다","슬라이스 대입으로 한 번에 지우면 훨씬 빠르다"]},{"id":"math-gcd","cat":"수학","title":"GCD · 빠른 거듭제곱","brief":"최대공약수, 최소공배수, 그리고 a^b mod m.","limits":"값 ≤ 10¹⁸ / 시간 O(log N)","logic":"유클리드 호제법은 a, b = b, a % b 한 줄. 거듭제곱은 지수를 이진수로 보고 절반씩 접는다.","code":"def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\n\n\ndef lcm(a, b):\n    return a // gcd(a, b) * b\n\n\ndef power_mod(base, exp, mod):\n    result = 1\n    base %= mod\n    while exp > 0:\n        if exp & 1:\n            result = result * base % mod\n        base = base * base % mod\n        exp >>= 1\n    return result","lv":4,"story":"최대공약수와 빠른 거듭제곱. 유클리드 호제법은 한 줄이고, 거듭제곱은 지수를 절반씩 접는다.","where":"분수 약분, 주기 문제, 모듈러 연산. 거듭제곱은 큰 수를 다루는 문제에서 필수다.","keys":["a, b = b, a % b 한 줄이 유클리드 호제법의 전부","최소공배수는 a // gcd * b 로 구한다 (곱한 뒤 나누면 오버플로 위험)","거듭제곱은 지수를 이진수로 보고 절반씩 접는다"]},{"id":"bs-bound","cat":"이분탐색","title":"lower / upper bound","brief":"정렬 배열에서 target 이상이 처음 나오는 위치, target 초과가 처음 나오는 위치.","limits":"N ≤ 1,000,000 / 시간 O(log N)","logic":"while lo < hi, hi = mid 를 쓴다. upper는 부등호에 등호를 하나 더 붙이는 것만 다르다. 개수 = upper - lower.","code":"def lower_bound(arr, target):\n    lo, hi = 0, len(arr)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo\n\n\ndef upper_bound(arr, target):\n    lo, hi = 0, len(arr)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if arr[mid] <= target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo","lv":5,"story":"값이 처음 나오는 위치와 마지막 다음 위치를 찾는다. 두 값을 빼면 그 값의 개수가 나온다.","where":"정렬된 배열에서 특정 값의 개수, 범위 질의. bisect 모듈이 같은 일을 해준다.","keys":["while lo < hi 와 hi = mid 를 쓴다. 기본형과 형태가 다르다","upper 는 부등호에 등호를 하나 더 붙이는 것만 다르다","개수 = upper - lower"]},{"id":"bs-param","cat":"이분탐색","title":"파라메트릭 서치","brief":"길이 N의 랜선들을 잘라 K개를 만들 때 가능한 최대 길이.","limits":"N ≤ 10,000 / 길이 ≤ 2³¹−1 / 시간 O(N log max)","logic":"답 자체를 이분탐색한다. possible(x)가 단조(참→거짓)여야 성립. 최댓값을 찾을 땐 참이면 lo = mid+1, 답은 hi.","code":"def max_cut_length(lines, k):\n    def count(length):\n        return sum(x // length for x in lines)\n\n    lo, hi = 1, max(lines)\n    answer = 0\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if count(mid) >= k:\n            answer = mid\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return answer","lv":5,"story":"답 자체를 이분탐색한다. \"이 값이 가능한가?\"가 참에서 거짓으로 한 번만 바뀔 때 성립한다.","where":"랜선 자르기, 나무 자르기, 최소를 최대로. 최적화 문제를 판정 문제로 바꾸는 발상이다.","keys":["가능 여부가 단조(참→거짓)여야 성립한다","최댓값을 찾을 땐 참이면 lo = mid + 1 로 밀고 답을 따로 기록한다","탐색 범위가 값의 범위이지 배열의 인덱스가 아니다"]},{"id":"st-monotonic","cat":"자료구조","title":"오큰수 (모노토닉 스택)","brief":"각 원소의 오른쪽에서 처음으로 자기보다 큰 수. 없으면 -1.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"인덱스를 담은 감소 스택을 유지한다. 현재 값이 스택 top보다 크면 그 top의 답이 확정되므로 꺼내면서 채운다.","code":"def next_greater(arr):\n    res = [-1] * len(arr)\n    stack = []\n    for i, x in enumerate(arr):\n        while stack and arr[stack[-1]] < x:\n            res[stack.pop()] = x\n        stack.append(i)\n    return res","lv":5,"story":"스택 안이 항상 감소 상태를 유지하도록 관리한다. 새 값이 들어올 때 꺼내지는 것들의 답이 확정된다.","where":"오큰수, 히스토그램 최대 직사각형, 주식 span. 이중 반복 O(N²) 을 O(N) 으로 줄이는 대표 기법이다.","keys":["인덱스를 담는 감소 스택을 유지한다","현재 값이 top 보다 크면 그 top 의 답이 확정된다","각 원소가 한 번씩만 들어가고 나가므로 O(N)"]},{"id":"pq-kth","cat":"우선순위큐","title":"최소/최대 힙 다루기","brief":"스트림에서 K번째로 큰 값을 매번 알아낸다.","limits":"N ≤ 200,000 / 시간 O(N log K)","logic":"크기 K인 최소 힙을 유지하면 루트가 K번째 큰 값. 파이썬 heapq는 최소 힙뿐이라 최대 힙은 부호를 뒤집는다.","code":"import heapq\n\n\ndef kth_largest_stream(nums, k):\n    heap = []\n    res = []\n    for x in nums:\n        heapq.heappush(heap, x)\n        if len(heap) > k:\n            heapq.heappop(heap)\n        res.append(heap[0] if len(heap) == k else -1)\n    return res","lv":5,"story":"크기 K인 힙을 유지하면 루트가 항상 K번째 값이다. 전부 정렬하지 않고 K개만 들고 있는다.","where":"스트림에서 상위 K개, 실시간 랭킹. 데이터가 계속 들어올 때 정렬을 다시 할 수 없는 상황.","keys":["크기 K 최소 힙의 루트가 K번째 큰 값","파이썬 heapq 는 최소 힙뿐이라 최대 힙은 부호를 뒤집는다","O(N log K) 로 O(N log N) 보다 빠르다"]},{"id":"pq-room","cat":"우선순위큐","title":"최소 회의실 개수","brief":"회의 [시작, 끝] 목록에 필요한 최소 회의실 수.","limits":"N ≤ 200,000 / 시간 O(N log N)","logic":"시작 시각 기준 정렬 후 끝나는 시각을 최소 힙에 넣는다. 가장 빨리 끝나는 회의가 이미 끝났으면 방을 재사용한다.","code":"import heapq\n\n\ndef min_rooms(meetings):\n    meetings = sorted(meetings)\n    heap = []\n    for start, end in meetings:\n        if heap and heap[0] <= start:\n            heapq.heappop(heap)\n        heapq.heappush(heap, end)\n    return len(heap)","lv":5,"story":"가장 빨리 끝나는 회의를 힙으로 관리하며 방을 재사용한다. 힙의 크기가 곧 필요한 방 수다.","where":"회의실 개수, 서버 대수, 주차 공간. 그리디와 힙을 함께 쓰는 대표 문제다.","keys":["시작 시각 기준 정렬 후 끝나는 시각을 힙에 넣는다","가장 빨리 끝나는 회의가 이미 끝났으면 방을 재사용한다","최종 힙 크기가 답이다"]},{"id":"bt-nqueen","cat":"백트래킹","title":"N-Queen","brief":"N×N 체스판에 서로 공격하지 않는 퀸 N개를 놓는 경우의 수.","limits":"N ≤ 14 / 시간 O(N!) 가지치기 포함","logic":"행 단위로 내려가며 열·대각선 두 방향을 집합으로 막는다. 대각선 키는 r+c 와 r-c.","code":"def n_queens(n):\n    cols = set()\n    diag1 = set()\n    diag2 = set()\n    count = 0\n\n    def back(row):\n        nonlocal count\n        if row == n:\n            count += 1\n            return\n        for c in range(n):\n            if c in cols or (row + c) in diag1 or (row - c) in diag2:\n                continue\n            cols.add(c)\n            diag1.add(row + c)\n            diag2.add(row - c)\n            back(row + 1)\n            cols.remove(c)\n            diag1.remove(row + c)\n            diag2.remove(row - c)\n\n    back(0)\n    return count","lv":5,"story":"행 단위로 내려가며 퀸을 놓고, 열과 두 대각선을 집합으로 막는다. 가지치기가 없으면 절대 못 푼다.","where":"백트래킹의 교과서. 스도쿠, 배치 문제에서 같은 구조가 반복된다.","keys":["대각선 키는 row + col 과 row - col","집합으로 막으면 검사가 O(1) 이다","되돌릴 때 반드시 집합에서도 빼야 한다"]},{"id":"dp-knapsack","cat":"DP","title":"0-1 배낭","brief":"무게 한도 W에서 물건을 골라 가치 합을 최대로.","limits":"N ≤ 100, W ≤ 100,000 / 시간 O(NW)","logic":"1차원 dp를 무게 역순으로 순회해야 같은 물건을 두 번 담지 않는다. 정순으로 돌면 무한 배낭이 된다.","code":"def knapsack(items, capacity):\n    dp = [0] * (capacity + 1)\n    for weight, value in items:\n        for w in range(capacity, weight - 1, -1):\n            dp[w] = max(dp[w], dp[w - weight] + value)\n    return dp[capacity]","lv":5,"story":"무게 한도 안에서 가치 합을 최대로 만든다. 1차원 dp 를 무게 역순으로 도는 것이 핵심이다.","where":"예산 안에서 최대 효용, 자원 배분. DP 중 출제 빈도가 가장 높은 축에 든다.","keys":["1차원 dp 를 무게 역순으로 순회해야 같은 물건을 두 번 안 담는다","정순으로 돌면 무한 배낭(중복 허용)이 된다","이 방향 하나가 문제의 종류를 바꾼다"]},{"id":"dp-lis","cat":"DP","title":"최장 증가 부분수열","brief":"수열에서 증가하는 부분수열의 최대 길이.","limits":"N ≤ 1,000,000 / 시간 O(N log N)","logic":"값을 담는 tails 배열에 bisect_left로 덮어쓴다. tails는 실제 LIS가 아니라 길이만 보장한다는 점이 함정.","code":"from bisect import bisect_left\n\n\ndef lis_length(arr):\n    tails = []\n    for x in arr:\n        i = bisect_left(tails, x)\n        if i == len(tails):\n            tails.append(x)\n        else:\n            tails[i] = x\n    return len(tails)","lv":5,"story":"증가하는 부분수열의 최대 길이를 O(N log N) 으로 구한다. tails 배열에 bisect 로 덮어쓴다.","where":"가장 긴 증가 수열, 전깃줄, 상자 넣기. O(N²) DP 로는 못 푸는 크기에서 쓴다.","keys":["tails 는 실제 LIS 가 아니라 길이만 보장한다","bisect_left 로 덮어쓰는 것이 전부","실제 수열이 필요하면 별도 역추적이 필요하다"]},{"id":"dp-lcs","cat":"DP","title":"최장 공통 부분수열","brief":"두 문자열의 공통 부분수열 중 가장 긴 것의 길이.","limits":"길이 ≤ 5,000 / 시간 O(NM)","logic":"글자가 같으면 왼쪽 위 대각선 +1, 다르면 위/왼쪽 중 큰 값. 2차원 표의 기본형.","code":"def lcs_length(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    return dp[n][m]","lv":5,"story":"두 문자열의 공통 부분수열 중 가장 긴 것을 구한다. 2차원 표 DP 의 기본형이다.","where":"문서 비교, diff 도구, DNA 서열 비교. 이 앱의 채점 엔진도 같은 알고리즘을 쓴다.","keys":["같으면 왼쪽 위 대각선 + 1, 다르면 위와 왼쪽 중 큰 값","표의 크기가 N × M 이라 길이가 5천을 넘으면 메모리를 신경 써야 한다","실제 문자열이 필요하면 표를 거꾸로 되짚는다"]},{"id":"gr-dijkstra","cat":"최단경로","title":"다익스트라","brief":"가중치가 음이 아닌 그래프에서 시작점부터 모든 정점까지 최단 거리.","limits":"V ≤ 20,000, E ≤ 300,000 / 시간 O(E log V)","logic":"힙에서 꺼낸 거리가 기록된 거리보다 크면 버린다(지연 삭제). 이 한 줄이 없으면 시간 초과가 난다.","code":"import heapq\n\n\ndef dijkstra(n, graph, start):\n    INF = float(\"inf\")\n    dist = [INF] * n\n    dist[start] = 0\n    heap = [(0, start)]\n    while heap:\n        d, cur = heapq.heappop(heap)\n        if d > dist[cur]:\n            continue\n        for nxt, w in graph[cur]:\n            nd = d + w\n            if nd < dist[nxt]:\n                dist[nxt] = nd\n                heapq.heappush(heap, (nd, nxt))\n    return dist","lv":5,"story":"가중치가 있는 그래프의 최단 거리를 구한다. 가장 가까운 것부터 확정해 나간다.","where":"지도 길찾기, 네트워크 지연, 배송 경로. 가중치가 있으면 BFS 로는 안 되고 이게 정답이다.","keys":["힙에서 꺼낸 거리가 기록된 거리보다 크면 버린다. 이 한 줄이 없으면 시간 초과다","음수 가중치가 있으면 쓸 수 없다 (벨만포드로)","O(E log V)"]},{"id":"gr-floyd","cat":"최단경로","title":"플로이드-워셜","brief":"모든 정점 쌍 사이의 최단 거리를 한 번에 구한다.","limits":"V ≤ 400 / 시간 O(V³)","logic":"경유지 k가 가장 바깥 루프여야 한다. 순서를 바꾸면 답이 틀린다.","code":"def floyd(n, edges):\n    INF = float(\"inf\")\n    dist = [[INF] * n for _ in range(n)]\n    for i in range(n):\n        dist[i][i] = 0\n    for u, v, w in edges:\n        dist[u][v] = min(dist[u][v], w)\n    for k in range(n):\n        for i in range(n):\n            for j in range(n):\n                if dist[i][k] + dist[k][j] < dist[i][j]:\n                    dist[i][j] = dist[i][k] + dist[k][j]\n    return dist","lv":5,"story":"모든 정점 쌍 사이의 최단 거리를 한 번에 구한다. 경유지를 하나씩 늘려가며 갱신한다.","where":"정점이 적고 모든 쌍이 필요할 때. 다익스트라를 V번 돌리는 것보다 코드가 훨씬 짧다.","keys":["경유지 k 가 반드시 가장 바깥 루프여야 한다","순서를 바꾸면 답이 틀린다","O(V³) 이라 정점이 400을 넘으면 못 쓴다"]},{"id":"gr-topo","cat":"그래프","title":"위상 정렬","brief":"선행 관계가 있는 작업들의 수행 순서. 사이클이 있으면 빈 리스트.","limits":"V ≤ 32,000, E ≤ 100,000 / 시간 O(V+E)","logic":"진입차수 0인 정점을 큐에 넣고 빼면서 이웃의 차수를 깎는다. 결과 길이가 V보다 작으면 사이클이 있다.","code":"from collections import deque\n\n\ndef topological_sort(n, graph):\n    indegree = [0] * n\n    for u in range(n):\n        for v in graph[u]:\n            indegree[v] += 1\n    q = deque([i for i in range(n) if indegree[i] == 0])\n    order = []\n    while q:\n        cur = q.popleft()\n        order.append(cur)\n        for nxt in graph[cur]:\n            indegree[nxt] -= 1\n            if indegree[nxt] == 0:\n                q.append(nxt)\n    return order if len(order) == n else []","lv":5,"story":"선행 관계가 있는 작업들의 수행 순서를 정한다. 진입차수가 0인 것부터 꺼낸다.","where":"선수과목, 빌드 순서, 작업 스케줄링. 결과 길이가 V보다 작으면 사이클이 있다는 뜻이다.","keys":["진입차수 0인 정점을 큐에 넣고 시작한다","꺼낼 때마다 이웃의 차수를 깎는다","결과 길이 < V 이면 사이클이 있다"]},{"id":"gr-mst","cat":"그래프","title":"크루스칼 + 유니온 파인드","brief":"모든 정점을 잇는 최소 비용 신장 트리의 가중치 합.","limits":"V ≤ 10,000, E ≤ 100,000 / 시간 O(E log E)","logic":"간선을 가중치순으로 정렬하고 사이클이 안 생길 때만 채택. find는 경로 압축, union은 랭크 비교.","code":"def kruskal(n, edges):\n    parent = list(range(n))\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n\n    def union(a, b):\n        ra, rb = find(a), find(b)\n        if ra == rb:\n            return False\n        parent[rb] = ra\n        return True\n\n    total = 0\n    for w, u, v in sorted(edges):\n        if union(u, v):\n            total += w\n    return total","lv":5,"story":"모든 정점을 잇는 최소 비용 연결망을 만든다. 싼 간선부터 사이클이 안 생길 때만 채택한다.","where":"네트워크 구축 비용, 도로 연결. 유니온 파인드가 함께 나오는 대표 문제다.","keys":["간선을 가중치순 정렬 후 사이클 검사하며 채택","find 는 경로 압축, union 은 랭크 비교","유니온 파인드 자체가 독립적으로도 자주 출제된다"]},{"id":"tree-dfs","cat":"트리","title":"트리 부모·깊이 구하기","brief":"루트가 1인 트리에서 각 노드의 부모와 깊이를 구한다.","limits":"N ≤ 100,000 / 시간 O(N)","logic":"부모 배열이 곧 방문 배열 역할을 한다. 반복형 BFS로 돌려야 재귀 깊이 제한을 피한다.","code":"from collections import deque\n\n\ndef tree_info(n, graph, root=0):\n    parent = [-1] * n\n    depth = [0] * n\n    visited = [False] * n\n    visited[root] = True\n    q = deque([root])\n    while q:\n        cur = q.popleft()\n        for nxt in graph[cur]:\n            if not visited[nxt]:\n                visited[nxt] = True\n                parent[nxt] = cur\n                depth[nxt] = depth[cur] + 1\n                q.append(nxt)\n    return parent, depth","lv":5,"story":"트리에서 각 노드의 부모와 깊이를 구한다. 부모 배열이 방문 배열 역할을 겸한다.","where":"트리 문제의 전처리. LCA, 트리 DP 가 전부 이 정보에서 시작한다.","keys":["부모 배열이 곧 방문 배열이다","파이썬은 재귀 깊이 제한이 있어 반복형 BFS 가 안전하다","트리는 사이클이 없어 부모만 피하면 중복 방문이 없다"]},{"id":"str-kmp","cat":"문자열","title":"KMP 패턴 매칭","brief":"문자열 안에서 패턴이 나타나는 모든 시작 위치.","limits":"길이 ≤ 1,000,000 / 시간 O(N+M)","logic":"실패 함수 pi[i] = 접두사와 접미사가 일치하는 최대 길이. 본 매칭 루프는 실패 함수 만드는 루프와 구조가 똑같다.","code":"def build_pi(pattern):\n    pi = [0] * len(pattern)\n    j = 0\n    for i in range(1, len(pattern)):\n        while j > 0 and pattern[i] != pattern[j]:\n            j = pi[j - 1]\n        if pattern[i] == pattern[j]:\n            j += 1\n            pi[i] = j\n    return pi\n\n\ndef kmp(text, pattern):\n    pi = build_pi(pattern)\n    res = []\n    j = 0\n    for i in range(len(text)):\n        while j > 0 and text[i] != pattern[j]:\n            j = pi[j - 1]\n        if text[i] == pattern[j]:\n            if j == len(pattern) - 1:\n                res.append(i - len(pattern) + 1)\n                j = pi[j]\n            else:\n                j += 1\n    return res","lv":5,"story":"패턴 매칭을 O(N+M) 으로 한다. 실패했을 때 처음부터 다시 보지 않고 건너뛴다.","where":"문자열 검색, 부분 문자열 찾기. 실패 함수를 만드는 루프와 본 매칭 루프의 구조가 똑같다는 것이 요점이다.","keys":["실패 함수 pi[i] 는 접두사와 접미사가 일치하는 최대 길이","두 루프의 구조가 같다. 하나를 외우면 둘 다 나온다","파이썬은 in 으로도 되지만 원리를 알아야 응용된다"]},{"id":"bit-tsp","cat":"비트마스킹","title":"외판원 순회 (비트마스크 DP)","brief":"모든 도시를 한 번씩 방문하고 출발지로 돌아오는 최소 비용.","limits":"N ≤ 16 / 시간 O(2^N · N²)","logic":"상태는 (방문 집합, 현재 도시). 방문 여부를 정수 비트로 압축하는 게 핵심. N이 20을 넘으면 못 쓴다.","code":"def tsp(cost):\n    n = len(cost)\n    INF = float(\"inf\")\n    full = (1 << n) - 1\n    dp = [[INF] * n for _ in range(1 << n)]\n    dp[1][0] = 0\n    for mask in range(1 << n):\n        for cur in range(n):\n            if dp[mask][cur] == INF or not (mask & (1 << cur)):\n                continue\n            for nxt in range(n):\n                if mask & (1 << nxt) or cost[cur][nxt] == 0:\n                    continue\n                nmask = mask | (1 << nxt)\n                value = dp[mask][cur] + cost[cur][nxt]\n                if value < dp[nmask][nxt]:\n                    dp[nmask][nxt] = value\n    best = INF\n    for cur in range(1, n):\n        if dp[full][cur] != INF and cost[cur][0]:\n            best = min(best, dp[full][cur] + cost[cur][0])\n    return best","lv":5,"story":"방문한 도시를 정수의 비트로 압축해 상태로 쓴다. 모든 도시를 한 번씩 돌아 출발지로 오는 최소 비용.","where":"외판원 순회, 배달 경로. 비트마스크 DP 의 대표 문제이고, N이 20을 넘으면 못 쓴다.","keys":["상태는 (방문 집합, 현재 도시)","방문 여부를 정수 비트로 압축하는 것이 핵심","O(2^N · N²) 이라 N ≤ 16 정도가 한계다"]},{"id":"ct-fastio","cat":"실전","title":"빠른 입출력 + 다중 테스트케이스","brief":"테스트케이스가 여러 개인 문제를 한 번에 읽고 한 번에 출력한다.","limits":"입력 1,000,000줄 / 시간 O(N)","logic":"전부 read().split()으로 읽고 인덱스를 밀면서 쓴다. 출력도 매번 print 하지 말고 리스트에 모아 한 번에 쓴다. 이것만으로 시간 초과가 풀리는 문제가 많다.","code":"import sys\n\n\ndef main():\n    data = sys.stdin.read().split()\n    idx = 0\n    t = int(data[idx])\n    idx += 1\n    out = []\n    for _ in range(t):\n        n = int(data[idx])\n        idx += 1\n        nums = list(map(int, data[idx:idx + n]))\n        idx += n\n        out.append(str(sum(nums)))\n    sys.stdout.write(\"\\n\".join(out))","lv":6,"story":"입력을 통째로 읽고 출력을 한 번에 내보낸다. 이것만으로 시간 초과가 풀리는 문제가 많다.","where":"테스트케이스가 여러 개인 문제, 입력이 100만 줄인 문제. 알고리즘이 맞는데 틀릴 때 제일 먼저 의심할 곳.","keys":["read().split() 으로 전부 읽고 인덱스를 밀며 쓴다","출력은 리스트에 모아 한 번에 write 한다","매번 print 하면 그것만으로 느려진다"]},{"id":"ct-sim-dir","cat":"실전","title":"방향 전환 시뮬레이션","brief":"명령대로 회전하고 전진하되 격자 밖으로는 나가지 않는다.","limits":"명령 ≤ 100,000 / 시간 O(N)","logic":"방향 배열을 북·동·남·서 시계 순서로 두면 오른쪽은 +1, 왼쪽은 +3 (즉 -1)을 4로 나눈 나머지. 순서를 섞어 적으면 전부 틀린다.","code":"def simulate(commands, n):\n    dr, dc = [-1, 0, 1, 0], [0, 1, 0, -1]\n    r = c = d = 0\n    for cmd in commands:\n        if cmd == \"L\":\n            d = (d + 3) % 4\n        elif cmd == \"R\":\n            d = (d + 1) % 4\n        else:\n            nr, nc = r + dr[d], c + dc[d]\n            if 0 <= nr < n and 0 <= nc < n:\n                r, c = nr, nc\n    return r, c, d","lv":6,"story":"명령대로 회전하고 전진하되 경계를 벗어나지 않는다. 방향 배열의 순서가 전부다.","where":"로봇 이동, 뱀 게임, 주사위 굴리기. 구현 문제에서 방향 전환은 거의 항상 나온다.","keys":["방향 배열을 북·동·남·서 시계 순서로 둔다","오른쪽은 (d + 1) % 4, 왼쪽은 (d + 3) % 4","순서를 섞어 적으면 전부 틀린다"]},{"id":"ct-bfs-state","cat":"실전","title":"상태를 추가한 BFS","brief":"벽을 최대 K번 부술 수 있을 때의 최단 거리.","limits":"N, M ≤ 1000, K ≤ 10 / 시간 O(NMK)","logic":"visited를 [행][열][남은 기회] 3차원으로 늘리는 게 전부다. 같은 칸이라도 남은 기회가 다르면 다른 상태라는 점이 핵심.","code":"from collections import deque\n\n\ndef shortest_with_break(grid, limit):\n    n, m = len(grid), len(grid[0])\n    dist = [[[0] * (limit + 1) for _ in range(m)] for _ in range(n)]\n    dr, dc = [-1, 1, 0, 0], [0, 0, -1, 1]\n    q = deque([(0, 0, 0)])\n    dist[0][0][0] = 1\n    while q:\n        r, c, k = q.popleft()\n        if (r, c) == (n - 1, m - 1):\n            return dist[r][c][k]\n        for i in range(4):\n            nr, nc = r + dr[i], c + dc[i]\n            if not (0 <= nr < n and 0 <= nc < m):\n                continue\n            if grid[nr][nc] == 0 and dist[nr][nc][k] == 0:\n                dist[nr][nc][k] = dist[r][c][k] + 1\n                q.append((nr, nc, k))\n            elif grid[nr][nc] == 1 and k < limit and dist[nr][nc][k + 1] == 0:\n                dist[nr][nc][k + 1] = dist[r][c][k] + 1\n                q.append((nr, nc, k + 1))\n    return -1","lv":6,"story":"같은 칸이라도 남은 기회가 다르면 다른 상태다. visited 를 3차원으로 늘리는 것이 전부다.","where":"벽 부수고 이동하기, 아이템 먹고 이동하기. BFS 응용 중 가장 자주 나오는 형태다.","keys":["visited 를 [행][열][남은 기회] 3차원으로 늘린다","같은 칸이라도 상태가 다르면 따로 방문해야 한다","상태가 늘어날수록 차원이 늘어난다"]},{"id":"ct-dp-path","cat":"실전","title":"DP + 경로 복원","brief":"최댓값만이 아니라 그 값을 만든 실제 답까지 되짚는다.","limits":"길이 ≤ 5,000 / 시간 O(NM)","logic":"표를 다 채운 뒤 오른쪽 아래에서 거꾸로 걸어 나온다. 글자가 같으면 대각선으로, 아니면 큰 쪽으로. 마지막에 뒤집는 걸 잊지 않는다.","code":"def lcs_with_path(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    path = []\n    i, j = n, m\n    while i > 0 and j > 0:\n        if a[i - 1] == b[j - 1]:\n            path.append(a[i - 1])\n            i -= 1\n            j -= 1\n        elif dp[i - 1][j] >= dp[i][j - 1]:\n            i -= 1\n        else:\n            j -= 1\n    return dp[n][m], \"\".join(reversed(path))","lv":6,"story":"최댓값만이 아니라 그 값을 만든 실제 답까지 되짚는다. 표를 다 채운 뒤 거꾸로 걸어 나온다.","where":"LCS 문자열 출력, 최적 경로 복원. \"몇 개인가\"가 아니라 \"무엇인가\"를 물을 때.","keys":["표를 다 채운 뒤 오른쪽 아래에서 거꾸로 걷는다","같으면 대각선으로, 다르면 큰 쪽으로","마지막에 뒤집는 것을 잊지 않는다"]},{"id":"ct-compress","cat":"실전","title":"좌표 압축","brief":"값의 범위는 넓지만 개수는 적을 때 인덱스로 눌러 담는다.","limits":"N ≤ 1,000,000 / 시간 O(N log N)","logic":"중복 제거 후 정렬한 표를 만들고 bisect_left로 순위를 찾는다. 배열 크기를 값 범위가 아니라 개수로 줄이는 전처리.","code":"from bisect import bisect_left\n\n\ndef compress(nums):\n    table = sorted(set(nums))\n    return [bisect_left(table, x) for x in nums], table","lv":6,"story":"값의 범위는 넓은데 개수가 적을 때 순위로 눌러 담는다. 배열 크기를 값 범위가 아니라 개수로 줄인다.","where":"좌표 압축이 필요한 세그먼트 트리, 구간 문제. 값이 10억인데 개수는 10만인 상황.","keys":["중복 제거 후 정렬한 표를 만든다","bisect_left 로 순위를 찾는다","배열 크기를 값 범위가 아닌 개수로 줄이는 전처리다"]}];

function resolveDb() {
  return new Promise(function (resolve) {
    /* 아티팩트 런타임은 iframe 안에서 돌아간다. 최상위 문서(깃허브 페이지 등)라면
       계정 저장소가 있을 수 없으므로 기다리지 않고 브라우저 저장소를 쓴다. */
    var embedded = true;
    try { embedded = (window.top !== window.self); } catch (e) { embedded = true; }
    if (!embedded && !(window.claude && typeof window.claude.use === 'function')) { resolve(null); return; }
    var t0 = Date.now();
    (function tick() {
      if (window.claude && typeof window.claude.use === 'function') {
        try {
          window.claude.use('db').then(function (d) { resolve(d || null); }, function () { resolve(null); });
        } catch (e) { resolve(null); }
        return;
      }
      if (Date.now() - t0 > 4000) { resolve(null); return; }
      setTimeout(tick, 100);
    })();
  });
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(LS);
    if (!raw) return;
    var o = JSON.parse(raw);
    S.problems = o.problems || []; S.books = o.books || []; S.insights = o.insights || [];
    S.settings = Object.assign({}, DEFAULTS, o.settings || {});
    S.daily = o.daily || {};
  } catch (e) { /* storage may be unavailable */ }
}
function saveLocal() {
  if (S.mode === 'cloud') return;
  try {
    localStorage.setItem(LS, JSON.stringify({
      problems: S.problems, books: S.books, insights: S.insights, settings: S.settings, daily: S.daily
    }));
  } catch (e) { /* quota or disabled */ }
}

/* 저장은 부가 기능이다. 동기 예외든 거부든 화면 흐름을 절대 막지 않는다. */
function dbWrite(fn) {
  if (!DB) return Promise.resolve();
  try {
    var r = fn();
    return (r && r.then) ? r.then(null, function () { }) : Promise.resolve();
  } catch (e) { return Promise.resolve(); }
}
function strip(o) {
  var c = {};
  Object.keys(o).forEach(function (k) { if (k !== 'id' && o[k] !== undefined) c[k] = o[k]; });
  return c;
}

function put(coll, arr, obj) {
  var i = -1;
  for (var k = 0; k < arr.length; k++) if (arr[k].id === obj.id) { i = k; break; }
  if (i < 0) arr.push(obj); else arr[i] = obj;
  if (DB) return dbWrite(function () { return DB.collection(coll).doc(obj.id).set(strip(obj)); });
  saveLocal(); return Promise.resolve();
}
function putMany(coll, arr, objs) {
  objs.forEach(function (o) { arr.push(o); });
  if (!DB) { saveLocal(); return Promise.resolve(); }
  var i = 0;
  function chunk() {
    if (i >= objs.length) return Promise.resolve();
    var part = objs.slice(i, i + 6); i += 6;
    return Promise.all(part.map(function (o) {

  return arr[0].due;
}

      '<div class="row"><button class="btn accent" data-act="go-pack">유형 팩 열기</button>' +

  if (fresh.length) {

      '<span class="chip accent">관문 모드 켜짐</span>' +
      '<span class="small muted grow">오늘 통과할 관문이 없습니다. 복습 예정이 잡히거나 재확인 대상이 생기면 이 화면이 먼저 막힙니다.</span>' +

function courseItems(c) { return CATALOG.filter(function (x) { return x.lv === c.lv; }); }
function bySrcMap() {
  var m = {};
  S.problems.forEach(function (p) { if (p.srcId) m[p.srcId] = p; });
  return m;
}
function courseStat(c) {
  var items = courseItems(c), m = bySrcMap(), reg = 0, done = 0, drilled = 0;
  items.forEach(function (it) {
    var p = m[it.id];
    if (!p) return;
    reg++;
    if ((p.attempts || []).length) drilled++;
    if (mastery(p).k === 'done') done++;
  });
  return { items: items, map: m, n: items.length, reg: reg, done: done, drilled: drilled };
}
function itemState(p) {
  if (!p) return { k: 'none', label: '미등록' };
  var m = mastery(p);
  if (m.k === 'done') return { k: 'done', label: '암기 완료' };
  if (m.k === 'recheck') return { k: 'recheck', label: '재확인' };
  if (m.k === 'near') return { k: 'near', label: m.label };
  if ((p.attempts || []).length) return { k: 'wip', label: '연습 중' };
  return { k: 'reg', label: '등록됨' };
}
function stateChip(st) {
  var cls = st.k === 'done' ? 'accent' : (st.k === 'recheck' ? 'bad' : (st.k === 'near' ? 'warn' : ''));
  return '<span class="chip ' + cls + '">' + (st.k === 'done' ? '✓ ' : '') + esc(st.label) + '</span>';
}
function packRegistered() {
  var have = {};
  S.problems.forEach(function (p) { if (p.srcId) have[p.srcId] = 1; });
  return have;
}
function viewPack() {
  if (S.courseSel) return viewCourseDetail();

  var have = packRegistered();
  var h = '<div class="sect-h"><h2>코스</h2><span class="sub">낮은 단계부터 순서대로</span></div>';

  h += '<div class="stack-g" style="margin-bottom:22px">' + COURSES.map(function (c) {
    var st = courseStat(c);
    var days = Math.ceil(st.n / c.pace);
    var pct = st.n ? st.done / st.n * 100 : 0;
    var started = st.reg > 0;
    var complete = st.done === st.n && st.n > 0;
    return '<div class="course' + (complete ? ' done' : '') + '" data-act="course-open" data-c="' + c.id + '">' +
      '<div class="row" style="align-items:flex-start">' +
      '<div class="cnum mono">L' + c.lv + '</div>' +
      '<div class="grow" style="min-width:0">' +
      '<div class="row" style="gap:8px"><strong style="font-size:15.5px">' + esc(c.name) + '</strong>' +
      '<span class="chip">' + esc(c.sub) + '</span>' +
      (complete ? '<span class="chip accent">수료</span>' : (started ? '<span class="chip warn">진행 중</span>' : '')) +
      '</div>' +
      '<div class="small muted" style="margin-top:4px">' + esc(c.goal) + '</div>' +
      '<div class="small mono muted" style="margin-top:6px">' +
      st.n + '개 · 하루 ' + c.pace + '개면 ' + days + '일' +
      (c.need ? ' · 선수 ' + esc(c.need) : '') + '</div>' +
      '<div class="bar" style="margin-top:9px"><i style="width:' + pct + '%"></i></div>' +
      '<div class="small mono muted" style="margin-top:5px">등록 ' + st.reg + '/' + st.n +
      ' · 암기 완료 ' + st.done + '/' + st.n + '</div>' +
      '</div></div></div>';
  }).join('') + '</div>';

  /* 낱개로 고르기 */
  h += '<details class="fold card pad"' + (S.packLv && S.packOpen ? ' open' : '') + '>' +
    '<summary>코스 말고 낱개로 고르기 — 전체 ' + CATALOG.length + '개 유형</summary>' +
    '<div style="margin-top:14px">' + packBrowser(have) + '</div></details>';
  return h;
}

function packBrowser(have) {
  var sel = Object.keys(S.packSel).filter(function (k) { return S.packSel[k]; });
  var lv = S.packLv;
  var pool = CATALOG.filter(function (c) { return !lv || c.lv === lv; });

  var h = '<div class="lvtabs">' +
    '<button class="lvtab' + (!lv ? ' on' : '') + '" data-act="pack-lv" data-l="0">전체 ' + CATALOG.length + '</button>' +
    LEVELS.map(function (L) {
      var all = CATALOG.filter(function (c) { return c.lv === L.n; });
      var got = all.filter(function (c) { return have[c.id]; }).length;
      return '<button class="lvtab' + (lv === L.n ? ' on' : '') + '" data-act="pack-lv" data-l="' + L.n + '">' +
        esc(L.name) + ' <span class="mono">' + got + '/' + all.length + '</span></button>';
    }).join('') + '</div>';

  var per = clamp(S.packPerDay, 1, 10);
  h += '<div class="row" style="margin-bottom:14px"><button class="btn sm" data-act="pack-all">보이는 것 전체 선택</button>' +
    '<button class="btn sm ghost" data-act="pack-none">해제</button><span class="grow"></span>' +
    '<label class="small muted" style="display:flex;align-items:center;gap:6px">하루' +
    '<input type="number" id="pack-per" min="1" max="10" value="' + per + '" style="width:56px;padding:5px 8px">개</label>' +
    '<button class="btn accent" data-act="pack-add"' + (sel.length ? '' : ' disabled') + '>' +
    (sel.length ? sel.length + '개 등록' : '선택하세요') + '</button></div>';

  var byCat = {}, order = [];
  pool.forEach(function (c) {
    var key = (lv ? '' : 'L' + c.lv + ' · ') + c.cat;
    if (!byCat[key]) { byCat[key] = []; order.push(key); }
    byCat[key].push(c);
  });
  h += order.map(function (key) {
    var items = byCat[key];
    return '<div style="margin-bottom:16px"><div class="sect-h"><h2 style="font-size:13.5px">' + esc(key) + '</h2>' +
      '<span class="sub">' + items.length + '개</span></div>' +
      items.map(function (c) {
        var reg = !!have[c.id], on = !!S.packSel[c.id];
        return '<div class="pk' + (reg ? ' reg' : '') + '">' +
          '<div class="row" style="align-items:flex-start;flex-wrap:nowrap">' +
          (reg ? '<span class="pkck done">✓</span>'
            : '<span class="pkck' + (on ? ' on' : '') + '" data-act="pack-tog" data-c="' + c.id + '">' + (on ? '✓' : '') + '</span>') +
          '<div class="grow" style="min-width:0">' +
          '<div style="font-weight:500;font-size:14px">' + esc(c.title) +
          (reg ? ' <span class="chip accent">등록됨</span>' : '') + '</div>' +
          '<div class="small muted" style="margin-top:2px">' + esc(c.brief) + '</div>' +
          '<details class="fold" style="margin-top:4px"><summary>코드 ' + c.code.split('\n').length + '줄</summary>' +
          '<div class="hintbox" style="margin:8px 0">' + esc(c.logic) + '</div>' +
          '<pre class="code">' + hl(c.code) + '</pre></details>' +
          '</div></div></div>';
      }).join('') + '</div>';
  }).join('');
  return h;
}
