<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algo-Memory · 알고리즘 통암기 스케줄러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec;
  --panel:#fffefb;
  --panel-2:#f9f7f1;
  --line:#e2ded2;
  --line-2:#d2ccbb;
  --ink:#1a1916;
  --ink-2:#56524a;
  --ink-3:#8b857a;
  --accent:#14755c;
  --accent-soft:#dff0e8;
  --warn:#a76a00;
  --warn-soft:#fbeed3;
  --bad:#b9382f;
  --bad-soft:#fae2df;
  --good:#14755c;
  --shadow:0 1px 2px rgba(26,25,22,.05), 0 8px 24px -16px rgba(26,25,22,.25);
  --r:14px;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111316;
    --panel:#1a1d21;
    --panel-2:#212529;
    --line:#2c3138;
    --line-2:#3a4048;
    --ink:#eceae4;
    --ink-2:#a8a49b;
    --ink-3:#797569;
    --accent:#4ed4a6;
    --accent-soft:#16342a;
    --warn:#e0a94a;
    --warn-soft:#3a2f18;
    --bad:#f0736a;
    --bad-soft:#3a1f1d;
    --good:#4ed4a6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#111316;
  --panel:#1a1d21;
  --panel-2:#212529;
  --line:#2c3138;
  --line-2:#3a4048;
  --ink:#eceae4;
  --ink-2:#a8a49b;
  --ink-3:#797569;
  --accent:#4ed4a6;
  --accent-soft:#16342a;
  --warn:#e0a94a;
  --warn-soft:#3a2f18;
  --bad:#f0736a;
  --bad-soft:#3a1f1d;
  --good:#4ed4a6;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.hbar{max-width:1120px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brand small{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;display:block;line-height:1}
.hspace{flex:1}
.today{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.iconbtn{
  border:1px solid var(--line); background:var(--panel); border-radius:9px;
  width:32px;height:32px;display:grid;place-items:center;cursor:pointer;font-size:14px;
}
.iconbtn:hover{border-color:var(--line-2)}
nav{max-width:1120px;margin:0 auto;padding:0 18px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  border:none;background:none;cursor:pointer;padding:7px 12px;border-radius:9px;
  color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap;position:relative;
}
nav button:hover{background:var(--panel-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav .badge{
  display:inline-block;min-width:17px;padding:0 4px;margin-left:6px;border-radius:20px;
  background:var(--bad);color:#fff;font-family:var(--mono);font-size:10.5px;line-height:17px;text-align:center;
}
nav button[aria-current="true"] .badge{background:var(--bg);color:var(--ink)}

main{max-width:1120px;margin:0 auto;padding:22px 18px 80px}
.view{display:none}
.view.on{display:block}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.sect-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sect-h h2{font-size:16px}
.sect-h .sub{font-size:12.5px;color:var(--ink-3)}
.grow{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

.btn{
  border:1px solid var(--line-2); background:var(--panel); color:var(--ink);
  padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:transform .06s ease, background .15s ease;
}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--panel)}
textarea{resize:vertical;min-height:90px}
textarea.code{font-family:var(--mono);font-size:13px;line-height:1.65;min-height:180px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;
  background:var(--panel-2);border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--ink-2);
  white-space:nowrap;
}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.mono{font-family:var(--mono)}

/* ---------- dashboard ---------- */
.today-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .lab{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
.tile .big{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.02em}
.tile .big em{font-style:normal;font-size:15px;color:var(--ink-3);font-weight:400;margin-left:3px}
.tile .note{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:11px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s ease}
.bar.warn > i{background:var(--warn)}
.bar.bad > i{background:var(--bad)}

.qlist{display:flex;flex-direction:column;gap:9px}
.qrow{
  display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
}
.qrow.over{border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
.qrow .meta{min-width:0;flex:1}
.qrow .ttl{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .sub{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rounds{display:flex;gap:3px}
.rounds i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:block}
.rounds i.done{background:var(--accent)}
.rounds i.now{background:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}

.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty .em{font-size:26px;display:block;margin-bottom:8px;opacity:.6}

/* ---------- problem bank ---------- */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters input[type=text]{max-width:260px}
.filters select{max-width:180px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{
  display:flex;gap:12px;align-items:center;padding:12px 15px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;cursor:pointer;box-shadow:var(--shadow);
}
.prow:hover{border-color:var(--line-2)}
.prow .meta{flex:1;min-width:0}
.rate{font-family:var(--mono);font-size:13px;font-weight:600;min-width:46px;text-align:right}
.rate.g{color:var(--good)} .rate.w{color:var(--warn)} .rate.b{color:var(--bad)}

.detail{margin-top:14px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink-3);font-size:12.5px}
.kv dd{margin:0;min-width:0;word-break:break-word}
pre.code{
  font-family:var(--mono);font-size:12.8px;line-height:1.7;background:var(--panel-2);
  border:1px solid var(--line);border-radius:10px;padding:13px 14px;overflow-x:auto;margin:0;
  white-space:pre;
}
.t-c{color:var(--ink-3);font-style:italic}
.t-s{color:var(--warn)}
.t-k{color:var(--accent);font-weight:500}
.t-b{color:var(--ink-2)}
.t-n{color:var(--bad)}

/* ---------- test ---------- */
.testhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.hintbox{background:var(--panel-2);border:1px dashed var(--line-2);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.editor-wrap{
  display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2);
}
.editor-wrap:focus-within{border-color:var(--accent)}
.gutter{
  font-family:var(--mono);font-size:13px;line-height:1.7;padding:12px 8px 12px 12px;
  color:var(--ink-3);text-align:right;background:transparent;user-select:none;overflow:hidden;
  min-width:44px;white-space:pre;
}
#codeInput{
  flex:1;border:none;border-radius:0;background:transparent;padding:12px 14px 12px 4px;
  font-family:var(--mono);font-size:13px;line-height:1.7;min-height:340px;white-space:pre;
  overflow-wrap:normal;overflow-x:auto;resize:vertical;
}
#codeInput:focus{background:transparent}
.editbar{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}

.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .num{font-family:var(--mono);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.03em}
.score .num em{font-style:normal;font-size:20px;color:var(--ink-3)}
.verdict{font-size:13.5px;font-weight:500}
.difflist{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--mono);font-size:12.6px;line-height:1.65}
.dl{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--panel)}
.dl:last-child{border-bottom:none}
.dl .mk{width:26px;flex:none;text-align:center;color:var(--ink-3);background:var(--panel-2);border-right:1px solid var(--line);user-select:none}
.dl .tx{padding:2px 10px;white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
.dl.same .tx{color:var(--ink-2)}
.dl.miss{background:var(--bad-soft)} .dl.miss .mk{color:var(--bad)}
.dl.extra{background:var(--warn-soft)} .dl.extra .mk{color:var(--warn)}
.dl mark{background:color-mix(in srgb, var(--bad) 28%, transparent);color:inherit;border-radius:3px;padding:0 1px}
.dl.extra mark{background:color-mix(in srgb, var(--warn) 34%, transparent)}
.ind{display:inline-block;color:var(--line-2)}

.checklist{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:6px 10px;border-radius:8px;background:var(--panel-2)}
.ck .s{font-family:var(--mono);font-size:12px;flex:none;width:16px;text-align:center}
.ck.ok{color:var(--ink-2)} .ck.ok .s{color:var(--good)}
.ck.no{background:var(--bad-soft)} .ck.no .s{color:var(--bad)}

.pk{padding:10px 0;border-bottom:1px solid var(--line)}
.pk:last-child{border-bottom:none;padding-bottom:0}
.pk.reg{opacity:.55}
.pkck{
  flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;cursor:pointer;font-size:12px;margin-top:2px;background:var(--panel-2);
  color:transparent;user-select:none;
}
.pkck:hover{border-color:var(--accent)}
.pkck.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.pkck.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);cursor:default}

.hintbox.warn-ko{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tracebox{
  position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
  overflow:auto;max-height:62vh;transition:border-color .12s ease, background .12s ease;
}
.tracebox:focus-within{border-color:var(--accent)}
.tracebox.err{border-color:var(--bad);background:var(--bad-soft)}
.traceview{
  font-family:var(--mono);font-size:13.5px;line-height:1.8;padding:16px;white-space:pre;margin:0;
  min-height:220px;
}
.traceview .done{color:var(--ink)}
.traceview .ghost{color:var(--ink-3);opacity:.45}
.traceview .cur{background:var(--accent);color:var(--bg);border-radius:2px;padding:0 1px}
.traceview .cur.end{background:var(--good)}
.tracein{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;border:none;outline:none;
  font-family:var(--mono);font-size:13.5px;line-height:1.8;padding:16px;white-space:pre;background:transparent;
}
.course{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s ease;
}
.course:hover{border-color:var(--accent)}
.course.done{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.cnum{
  flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);
}
.course.done .cnum{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.lvtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.lvtabs::-webkit-scrollbar{display:none}
.lvtab{
  border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;
  font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.lvtab:hover{border-color:var(--line-2);color:var(--ink)}
.lvtab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvtab .mono{opacity:.65;font-size:11.5px}

.verdict-card{border-width:1.5px}
.verdict-card.ok{border-color:var(--good)}
.verdict-card.no{border-color:var(--bad)}
.stamp{
  flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;text-align:center;
  font-weight:700;font-size:15px;line-height:1.15;letter-spacing:-.02em;transform:rotate(-8deg);
}
.stamp.ok{border:3px solid var(--good);color:var(--good)}
.stamp.no{border:3px dashed var(--bad);color:var(--bad)}

.gate{border-color:var(--bad);border-width:1.5px}
body.gated nav button:not([data-v="dash"]){opacity:.35;pointer-events:none}

/* ---------- books ---------- */
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.book{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}
.ins{border-left:2px solid var(--accent);padding:2px 0 2px 13px;margin-bottom:14px}
.ins .q{font-size:14px;line-height:1.65;white-space:pre-wrap}
.ins .m{font-size:11.5px;color:var(--ink-3);margin-top:5px;font-family:var(--mono)}

/* ---------- stats ---------- */
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.chart .stack{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .b{width:72%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:2px;position:relative}
.chart .b.part{background:var(--warn)}
.chart .b.zero{background:var(--line);min-height:2px}
.chart .cl{font-size:9.5px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:96px 1fr 46px;gap:10px;align-items:center;font-size:12.5px}
.hb .track{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.hb .track > i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hb .track > i.w{background:var(--warn)}
.hb .track > i.b{background:var(--bad)}
.hb .v{font-family:var(--mono);text-align:right;color:var(--ink-2)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* ---------- misc ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:90;max-width:90vw;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.4);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.scroller{overflow-x:auto}
details.fold > summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;list-style:none;padding:4px 0}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:"▸ ";color:var(--ink-3)}
details.fold[open] > summary::before{content:"▾ "}
.stack-g{display:flex;flex-direction:column;gap:14px}

@media (max-width:760px){
  .today-strip{grid-template-columns:1fr;gap:9px}
  .tile{display:flex;align-items:baseline;gap:12px;padding:14px 15px}
  .tile .lab{flex:1}
  .tile .big{margin-top:0;font-size:24px}
  .tile .bar{position:absolute;left:0;right:0;bottom:0;margin:0;border-radius:0;height:3px}
  .tile .note{display:none}
  .f2,.f3{grid-template-columns:1fr}
  .qrow{flex-wrap:wrap}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dt{margin-top:8px}
  .hb{grid-template-columns:76px 1fr 42px;font-size:12px}
  main{padding:16px 13px 70px}
  .hbar{padding:10px 13px}
  nav{padding:0 13px 8px}
  .score .num{font-size:40px}
  .stamp{width:62px;height:62px;font-size:13px}
  .f3{grid-template-columns:1fr}
}

<script>
(function () {
'use strict';

/* ============ utils ============ */
var $ = function (s) { return document.querySelector(s); };
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return String(n).padStart(2, '0'); }
function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return dstr(new Date()); }
function addDays(ds, n) {
  var p = ds.split('-').map(Number), dt = new Date(p[0], p[1] - 1, p[2]);
  dt.setDate(dt.getDate() + n); return dstr(dt);
}
function dayDiff(a, b) {
  var x = a.split('-').map(Number), y = b.split('-').map(Number);
  return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 86400000);
}
function relDate(ds) {
  var d = dayDiff(today(), ds);
  if (d === 0) return '오늘'; if (d === 1) return '내일'; if (d === -1) return '어제';
  if (d < 0) return Math.abs(d) + '일 지남';
  return ds.slice(5).replace('-', '/');
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200);
}
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
function num(id, dflt) { var v = parseInt(val(id), 10); return isNaN(v) ? (dflt || 0) : v; }

var CATS = ['구현', '완전탐색', 'DFS', 'BFS', '백트래킹', '이분탐색', '투포인터', '정렬', '그리디',
  'DP', '그래프', '최단경로', '최소신장트리', '분리집합', '문자열', '자료구조', '수학', '비트마스킹', '트리', '우선순위큐'];
var LANGS = ['python', 'java', 'cpp', 'javascript', 'kotlin'];
var LANG_LABEL = { python: 'Python', java: 'Java', cpp: 'C++', javascript: 'JavaScript', kotlin: 'Kotlin' };

/* ============ state ============ */
var CATALOG = [{"id":"s0-var","cat":"기초 문법","title":"변수와 출력","brief":"값을 이름에 담고 화면에 찍는다.","limits":"제일 처음 외울 3줄","logic":"= 는 '같다'가 아니라 오른쪽 값을 왼쪽 이름에 넣으라는 뜻이다. print에 쉼표로 여러 개를 넘기면 사이에 한 칸이 저절로 들어간다.","code":"name = \"gony\"\nage = 35\nscore = 92.5\n\nprint(name)\nprint(age, score)\nprint(\"name:\", name)","lv":1},{"id":"s0-math","cat":"기초 문법","title":"사칙연산과 나머지","brief":"더하기 빼기 곱하기 나누기, 그리고 몫과 나머지.","limits":"% 와 // 를 구분하는 게 전부","logic":"/ 는 소수점까지 나오는 나눗셈, // 는 몫만, % 는 나머지. 짝수 판별은 % 2 == 0, 배수 판별은 % k == 0 이 전부다.","code":"a = 7\nb = 3\n\nprint(a + b)\nprint(a - b)\nprint(a * b)\nprint(a // b)\nprint(a % b)","lv":1},{"id":"s0-func","cat":"기초 문법","title":"함수 만들기","brief":"재료를 받아 결과를 돌려주는 상자를 만든다.","limits":"앞으로 나올 모든 코드의 껍데기","logic":"def 이름(재료): 로 시작하고 return 으로 결과를 돌려준다. return 을 안 쓰면 None이 나온다. 함수 안쪽은 반드시 네 칸 들여쓴다.","code":"def add(a, b):\n    return a + b\n\n\ndef greet(name):\n    return \"hi \" + name\n\n\nprint(add(2, 3))\nprint(greet(\"gony\"))","lv":1},{"id":"s0-if","cat":"기초 문법","title":"if 조건문","brief":"점수에 따라 등급을 돌려준다.","limits":"조건은 위에서부터 차례로 검사된다","logic":"처음 맞는 조건에서 멈추고 나머지는 보지 않는다. 그래서 90점 조건을 80점 조건보다 먼저 써야 한다. 조건 끝의 콜론과 들여쓰기가 첫 관문.","code":"def grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    else:\n        return \"C\"","lv":1},{"id":"s0-for","cat":"기초 문법","title":"for 반복문","brief":"정해진 횟수만큼 돌면서 값을 쌓는다.","limits":"range의 시작과 끝을 외운다","logic":"range(n)은 0부터 n-1까지다. 1부터 n까지 돌리려면 range(1, n + 1)로 써야 한다. 이 한 칸 차이가 초보 때 제일 많이 틀리는 자리.","code":"def sum_to(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i\n    return total\n\n\ndef repeat(word, n):\n    for i in range(n):\n        print(i, word)","lv":1},{"id":"s0-while","cat":"기초 문법","title":"while 반복문","brief":"조건이 참인 동안 계속 돈다.","limits":"멈추는 줄을 빠뜨리면 무한 루프","logic":"횟수를 미리 알면 for, 조건으로 멈춰야 하면 while. 루프 안에서 조건에 쓰는 값을 반드시 바꿔줘야 끝난다.","code":"def count_down(n):\n    result = []\n    while n > 0:\n        result.append(n)\n        n -= 1\n    return result","lv":1},{"id":"s0-loopif","cat":"기초 문법","title":"반복문 안의 조건문","brief":"여러 값 중 조건에 맞는 것만 골라낸다.","limits":"for 와 if 를 겹쳐 쓰는 첫 연습","logic":"빈 그릇을 루프 밖에서 먼저 만든다. 루프 안에서 만들면 매번 비워져서 마지막 하나만 남는다. 이게 초보 단계 최다 실수.","code":"def even_numbers(n):\n    result = []\n    for i in range(1, n + 1):\n        if i % 2 == 0:\n            result.append(i)\n    return result\n\n\ndef count_multiples(nums, k):\n    count = 0\n    for x in nums:\n        if x % k == 0:\n            count += 1\n    return count","lv":1},{"id":"s0-list","cat":"기초 자료형","title":"리스트 기본","brief":"값 여러 개를 한 줄에 담고 꺼낸다.","limits":"번호는 0부터, 뒤에서는 -1","logic":"슬라이싱 [1:3] 은 1번부터 3번 '앞'까지라 3번은 안 들어온다. 끝 번호를 포함하지 않는다는 게 파이썬의 일관된 규칙.","code":"def list_basics():\n    nums = [10, 20, 30]\n    nums.append(40)\n    first = nums[0]\n    last = nums[-1]\n    part = nums[1:3]\n    size = len(nums)\n    return nums, first, last, part, size","lv":1},{"id":"s0-listsum","cat":"기초 자료형","title":"리스트 훑으며 합과 개수","brief":"전부 더하고, 조건에 맞는 것을 세고, 평균을 낸다.","limits":"N ≤ 1,000,000","logic":"합을 담을 그릇을 0으로 두고 루프 안에서 더한다. total = 0 을 루프 안에 쓰면 매번 초기화돼서 마지막 값만 남는다.","code":"def summarize(nums):\n    total = 0\n    count = 0\n    for x in nums:\n        total += x\n        if x > 0:\n            count += 1\n    average = total / len(nums)\n    return total, count, average","lv":1},{"id":"s0-str","cat":"기초 자료형","title":"문자열 꺼내 쓰기","brief":"글자 하나, 뒷글자, 일부분, 길이, 대문자.","limits":"리스트와 꺼내는 방법이 똑같다","logic":"문자열도 리스트처럼 번호로 꺼낸다. 다만 s[0] = 'x' 처럼 바꾸는 건 안 된다. 바꾸려면 새 문자열을 만들어야 한다.","code":"def string_intro(s):\n    first = s[0]\n    last = s[-1]\n    part = s[1:4]\n    length = len(s)\n    upper = s.upper()\n    return first, last, part, length, upper","lv":1},{"id":"s0-dict","cat":"기초 자료형","title":"딕셔너리 기본","brief":"번호 대신 이름표로 값을 꺼낸다.","limits":"없는 키를 꺼내면 에러가 난다","logic":"리스트는 번호로, 딕셔너리는 이름표로 꺼낸다. 없는 이름표를 [] 로 꺼내면 바로 에러라 in 으로 먼저 확인하거나 .get() 을 쓴다.","code":"def dict_basics():\n    ages = {\"ann\": 35, \"bob\": 28}\n    ages[\"cara\"] = 22\n    ann = ages[\"ann\"]\n    has_bob = \"bob\" in ages\n    safe = ages.get(\"dave\", 0)\n    return ages, ann, has_bob, safe","lv":1},{"id":"s0-input","cat":"기초 입출력","title":"입력 받기","brief":"숫자 하나, 한 줄에 여러 수, 단어 목록을 읽는다.","limits":"입력이 적을 때 쓰는 기본형","logic":"input()은 무조건 글자로 들어온다. 숫자로 쓰려면 int()로 바꿔야 한다. 한 줄에 여러 개면 split()으로 쪼갠 뒤 map(int, ...)로 한꺼번에 바꾼다.","code":"def read_simple():\n    n = int(input())\n    a, b = map(int, input().split())\n    words = input().split()\n    return n, a, b, words","lv":1},{"id":"py-listcomp","cat":"파이썬 기본","title":"리스트 컴프리헨션","brief":"반복문으로 쓰던 리스트 만들기를 한 줄로 바꾼다.","limits":"가장 많이 쓰는 문법 / 손에 붙을 때까지","logic":"[식 for 변수 in 반복가능 if 조건] 순서. 조건이 먼저 걸러지고 식이 적용된다. 중첩은 바깥 for를 먼저 쓴다.","code":"def transform(nums):\n    squares = [x * x for x in nums]\n    evens = [x for x in nums if x % 2 == 0]\n    labeled = [(i, x) for i, x in enumerate(nums)]\n    return squares, evens, labeled","lv":2},{"id":"py-count","cat":"파이썬 기본","title":"딕셔너리로 개수 세기","brief":"등장 횟수를 세고 가장 많이 나온 것을 찾는다.","limits":"해시 문제의 절반은 이걸로 풀린다","logic":"get(x, 0) + 1 패턴을 먼저 외우고, Counter는 그 축약형으로 쓴다. Counter는 없는 키를 조회해도 0을 돌려준다.","code":"from collections import Counter\n\n\ndef count_items(items):\n    counter = {}\n    for x in items:\n        counter[x] = counter.get(x, 0) + 1\n    return counter\n\n\ndef most_common(items, n):\n    return Counter(items).most_common(n)","lv":2},{"id":"py-string","cat":"파이썬 기본","title":"문자열 기본 조작","brief":"뒤집기, 자르기, 나누기, 붙이기, 치환.","limits":"길이 ≤ 100,000 / 슬라이싱은 O(N)","logic":"문자열은 바꿀 수 없으므로 모든 연산이 새 문자열을 만든다. 루프에서 += 로 이어붙이면 느려지니 list에 모아 join 한다.","code":"def string_basics(s):\n    reversed_s = s[::-1]\n    words = s.split()\n    joined = \"-\".join(words)\n    no_space = s.replace(\" \", \"\")\n    head, tail = s[:3], s[-3:]\n    return reversed_s, words, joined, no_space, head, tail\n\n\ndef build_fast(chars):\n    parts = []\n    for ch in chars:\n        parts.append(ch.upper())\n    return \"\".join(parts)","lv":2},{"id":"py-enumerate","cat":"파이썬 기본","title":"enumerate와 zip","brief":"인덱스와 값을 함께, 두 리스트를 나란히 순회한다.","limits":"range(len(x)) 대신 쓰는 습관을 들인다","logic":"enumerate(arr, start=1)로 번호를 1부터 시작할 수 있다. zip은 짧은 쪽에 맞춰 잘리므로 길이가 다르면 손실이 난다.","code":"def pair_up(names, scores):\n    result = []\n    for rank, (name, score) in enumerate(zip(names, scores), start=1):\n        result.append((rank, name, score))\n    return result\n\n\ndef unzip(pairs):\n    lefts, rights = zip(*pairs)\n    return list(lefts), list(rights)","lv":2},{"id":"py-grid","cat":"파이썬 기본","title":"2차원 리스트 만들기","brief":"N×M 격자를 만들고 순회하고 뒤집는다.","limits":"N, M ≤ 1000","logic":"[[0] * m] * n 은 같은 행을 n번 참조해서 한 칸만 바꿔도 전부 바뀐다. 반드시 for 문으로 새 행을 만든다.","code":"def make_grid(n, m):\n    grid = [[0] * m for _ in range(n)]\n    for r in range(n):\n        for c in range(m):\n            grid[r][c] = r * m + c\n    return grid\n\n\ndef transpose(grid):\n    return [list(row) for row in zip(*grid)]","lv":2},{"id":"py-minmax","cat":"파이썬 기본","title":"최댓값과 그 위치","brief":"가장 큰 값, 그 인덱스, 상위 K개를 구한다.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"max(arr)로 값만 얻고 index()로 위치를 또 찾으면 두 번 훑는다. 한 번에 갱신하는 루프를 외운다.","code":"def max_with_index(nums):\n    best = 0\n    for i in range(1, len(nums)):\n        if nums[i] > nums[best]:\n            best = i\n    return nums[best], best\n\n\ndef top_k(nums, k):\n    return sorted(nums, reverse=True)[:k]","lv":2},{"id":"py-sortbasic","cat":"파이썬 기본","title":"정렬 기본기","brief":"오름·내림차순, 길이순, 람다 키, 제자리 정렬의 차이.","limits":"N ≤ 1,000,000 / 시간 O(N log N)","logic":"sorted는 새 리스트를 돌려주고 .sort()는 제자리에서 바꾸며 None을 돌려준다. 이걸 헷갈려서 None이 튀어나오는 실수가 제일 잦다.","code":"def sort_basics(nums, words):\n    asc = sorted(nums)\n    desc = sorted(nums, reverse=True)\n    by_length = sorted(words, key=len)\n    by_last = sorted(words, key=lambda w: w[-1])\n    return asc, desc, by_length, by_last\n\n\ndef sort_in_place(nums):\n    nums.sort(reverse=True)\n    return nums","lv":2},{"id":"sort-key","cat":"정렬","title":"다중 조건 정렬","brief":"나이는 오름차순, 나이가 같으면 이름은 가입순(입력 순서) 유지.","limits":"N ≤ 100000 / 시간 O(N log N)","logic":"파이썬 sort는 안정 정렬이라 동점은 입력 순서가 보존된다. 점수 내림차순 + 이름 오름차순처럼 방향이 섞이면 숫자는 -x로 뒤집고 문자열은 그대로 둔 채 튜플로 묶는다.","code":"def sort_members(members):\n    return sorted(members, key=lambda x: x[0])\n\n\ndef sort_mixed(items):\n    return sorted(items, key=lambda x: (-x[1], x[0]))","lv":3},{"id":"py-divisor","cat":"파이썬 기본","title":"약수와 소수 판정","brief":"약수를 모두 구하고, 어떤 수가 소수인지 판정한다.","limits":"N ≤ 1,000,000,000 / 시간 O(√N)","logic":"i가 약수면 n//i도 약수다. 루프는 √N까지만 돌면 되고, i == n//i 인 제곱근은 한 번만 넣는다.","code":"def divisors(n):\n    res = []\n    i = 1\n    while i * i <= n:\n        if n % i == 0:\n            res.append(i)\n            if i != n // i:\n                res.append(n // i)\n        i += 1\n    return sorted(res)\n\n\ndef is_prime(n):\n    if n < 2:\n        return False\n    i = 2\n    while i * i <= n:\n        if n % i == 0:\n            return False\n        i += 1\n    return True","lv":3},{"id":"py-base","cat":"파이썬 기본","title":"진법 변환","brief":"10진수를 n진수 문자열로, n진수 문자열을 10진수로.","limits":"2 ≤ base ≤ 16","logic":"나머지를 앞에 붙이며 몫으로 내려간다. 0은 루프를 한 번도 안 도니 따로 처리한다. 반대 방향은 int(s, base) 한 줄.","code":"def to_base(n, base):\n    if n == 0:\n        return \"0\"\n    digits = \"0123456789ABCDEF\"\n    res = \"\"\n    while n > 0:\n        res = digits[n % base] + res\n        n //= base\n    return res\n\n\ndef from_base(s, base):\n    return int(s, base)","lv":3},{"id":"py-input","cat":"파이썬 기본","title":"입력 받기 기본형","brief":"개수, 한 줄 여러 수, 격자, 문자열 여러 줄을 읽는다.","limits":"입력 100,000줄 이상이면 반드시 readline","logic":"실제 제출에서는 파일 맨 위에 input = sys.stdin.readline 한 줄을 넣는다. readline은 개행이 붙어 오므로 문자열은 rstrip()이 필수.","code":"import sys\n\n\ndef read_input():\n    readline = sys.stdin.readline\n    n = int(readline())\n    nums = list(map(int, readline().split()))\n    grid = [list(map(int, readline().split())) for _ in range(n)]\n    words = [readline().rstrip() for _ in range(n)]\n    return n, nums, grid, words","lv":3},{"id":"lv-hash-pair","cat":"해시","title":"해시로 짝 안 맞는 하나 찾기","brief":"두 목록을 비교해 한쪽에만 있는 원소를 찾는다. 동명이인 있음.","limits":"N ≤ 100,000 / 시간 O(N)","logic":"정렬해서 비교하면 O(N log N), 카운터로 빼면 O(N). 중복이 있으니 set으로 풀면 틀린다.","code":"from collections import Counter\n\n\ndef find_missing(left, right):\n    counter = Counter(left)\n    for name in right:\n        counter[name] -= 1\n    for name, cnt in counter.items():\n        if cnt > 0:\n            return name\n    return \"\"","lv":3},{"id":"lv-double-loop","cat":"완전탐색","title":"이중 반복 완전탐색","brief":"모든 두 원소 쌍을 확인해 조건을 만족하는 최선을 찾는다.","limits":"N ≤ 2,000 / 시간 O(N²)","logic":"i < j 를 지키려고 안쪽 루프를 i+1부터 시작한다. N이 3,000을 넘어가면 이 방식은 버리고 정렬+투포인터로 바꾼다.","code":"def best_pair(nums, limit):\n    best = -1\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            total = nums[i] + nums[j]\n            if total <= limit and total > best:\n                best = total\n    return best","lv":3},{"id":"lv-prefix","cat":"누적합","title":"누적합으로 구간 합","brief":"구간 합 질의가 여러 번 들어올 때 매번 더하지 않는다.","limits":"N, Q ≤ 100,000 / 전처리 O(N), 질의 O(1)","logic":"prefix[i+1] = prefix[i] + nums[i] 로 한 칸 밀어서 만든다. 구간 [l, r] 합은 prefix[r+1] - prefix[l]. 밀어놓는 이유가 l=0 예외를 없애기 위해서다.","code":"def build_prefix(nums):\n    prefix = [0] * (len(nums) + 1)\n    for i, x in enumerate(nums):\n        prefix[i + 1] = prefix[i] + x\n    return prefix\n\n\ndef range_sum(prefix, left, right):\n    return prefix[right + 1] - prefix[left]","lv":3},{"id":"lv-greedy-coin","cat":"그리디","title":"그리디 거스름돈","brief":"큰 단위부터 최대한 쓰며 금액을 맞춘다.","limits":"동전 ≤ 100 / 시간 O(N)","logic":"동전 단위가 서로 배수 관계일 때만 그리디가 최적이다. 아니면 DP(동전 교환)로 가야 한다. 이 구분이 함정.","code":"def make_change(amount, coins):\n    coins = sorted(coins, reverse=True)\n    used = []\n    for coin in coins:\n        cnt = amount // coin\n        if cnt:\n            used.append((coin, cnt))\n            amount -= coin * cnt\n    return used if amount == 0 else []","lv":3},{"id":"lv-greedy-meet","cat":"그리디","title":"최대 회의 개수","brief":"겹치지 않게 회의를 최대 몇 개 넣을 수 있는지.","limits":"N ≤ 100,000 / 시간 O(N log N)","logic":"끝나는 시간 기준 정렬이 핵심. 시작 시간으로 정렬하면 틀린다. 끝 시간이 같으면 시작 시간이 빠른 것을 앞에 둔다.","code":"def max_meetings(meetings):\n    meetings = sorted(meetings, key=lambda x: (x[1], x[0]))\n    count = 0\n    last_end = float(\"-inf\")\n    for start, end in meetings:\n        if start >= last_end:\n            count += 1\n            last_end = end\n    return count","lv":3},{"id":"lv-window-fixed","cat":"투포인터","title":"고정 길이 슬라이딩 윈도우","brief":"길이 K인 연속 구간 합의 최댓값.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"매번 sum을 다시 부르면 O(NK)가 된다. 들어온 것을 더하고 나간 것을 빼는 한 줄이 전부.","code":"def max_window_sum(nums, k):\n    total = sum(nums[:k])\n    best = total\n    for i in range(k, len(nums)):\n        total += nums[i] - nums[i - k]\n        if total > best:\n            best = total\n    return best","lv":3},{"id":"lv-deque","cat":"자료구조","title":"덱으로 순환 처리","brief":"줄을 돌리거나, 정해진 간격으로 하나씩 빼낸다.","limits":"N ≤ 100,000 / 시간 O(N·K)","logic":"list.pop(0)는 O(N)이라 큐로 쓰면 안 된다. deque.rotate(-k)는 왼쪽으로 k칸, 양수는 오른쪽으로 민다.","code":"from collections import deque\n\n\ndef rotate_left(items, k):\n    q = deque(items)\n    q.rotate(-k)\n    return list(q)\n\n\ndef round_robin(items, step):\n    q = deque(items)\n    order = []\n    while q:\n        q.rotate(-(step - 1))\n        order.append(q.popleft())\n    return order","lv":3},{"id":"lv-set","cat":"해시","title":"집합 연산","brief":"교집합, 합집합, 차집합, 중복 제거.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"set은 순서를 보장하지 않으므로 출력이 필요하면 sorted를 씌운다. in 검사가 리스트는 O(N), set은 O(1)인 게 핵심 이유.","code":"def set_ops(a, b):\n    sa, sb = set(a), set(b)\n    common = sorted(sa & sb)\n    merged = sorted(sa | sb)\n    only_a = sorted(sa - sb)\n    return common, merged, only_a, len(sa)","lv":3},{"id":"sim-rotate","cat":"구현","title":"2차원 배열 90도 회전","brief":"N×M 격자를 시계 방향으로 90도 돌린 결과를 반환한다.","limits":"N, M ≤ 1000 / 시간 O(NM)","logic":"zip(*grid[::-1])이 시계, zip(*grid)[::-1]이 반시계. 인덱스로 직접 쓸 때는 new[c][N-1-r] = grid[r][c].","code":"def rotate(grid):\n    n, m = len(grid), len(grid[0])\n    new = [[0] * n for _ in range(m)]\n    for r in range(n):\n        for c in range(m):\n            new[c][n - 1 - r] = grid[r][c]\n    return new","lv":4},{"id":"sim-spiral","cat":"구현","title":"나선형 채우기","brief":"N×N 격자를 바깥에서 안으로 돌며 1부터 N*N까지 채운다.","limits":"N ≤ 500 / 시간 O(N²)","logic":"방향 배열 4개를 순서대로 두고, 벽이나 이미 채운 칸을 만나면 방향을 한 칸 돌린다.","code":"def spiral(n):\n    grid = [[0] * n for _ in range(n)]\n    dr, dc = [0, 1, 0, -1], [1, 0, -1, 0]\n    r = c = d = 0\n    for v in range(1, n * n + 1):\n        grid[r][c] = v\n        nr, nc = r + dr[d], c + dc[d]\n        if not (0 <= nr < n and 0 <= nc < n) or grid[nr][nc]:\n            d = (d + 1) % 4\n            nr, nc = r + dr[d], c + dc[d]\n        r, c = nr, nc\n    return grid","lv":4},{"id":"bf-comb","cat":"완전탐색","title":"조합 완전탐색","brief":"N개 중 M개를 고르는 모든 경우를 사전순으로 만든다.","limits":"N ≤ 20 / 시간 O(C(N,M)·M)","logic":"시작 인덱스를 넘겨 중복을 막는다. 재귀 깊이 == 고른 개수.","code":"def combinations(arr, m):\n    res = []\n    path = []\n\n    def back(start):\n        if len(path) == m:\n            res.append(path[:])\n            return\n        for i in range(start, len(arr)):\n            path.append(arr[i])\n            back(i + 1)\n            path.pop()\n\n    back(0)\n    return res","lv":4},{"id":"bf-perm","cat":"완전탐색","title":"순열 완전탐색","brief":"N개 중 M개를 뽑아 나열하는 모든 순서를 만든다.","limits":"N ≤ 10 / 시간 O(P(N,M)·M)","logic":"used 배열로 이미 쓴 원소를 막는다. 조합과 달리 매번 0부터 훑는다.","code":"def permutations(arr, m):\n    res = []\n    path = []\n    used = [False] * len(arr)\n\n    def back():\n        if len(path) == m:\n            res.append(path[:])\n            return\n        for i in range(len(arr)):\n            if used[i]:\n                continue\n            used[i] = True\n            path.append(arr[i])\n            back()\n            path.pop()\n            used[i] = False\n\n    back()\n    return res","lv":4},{"id":"sort-count","cat":"정렬","title":"계수 정렬","brief":"값의 범위가 작은 대량의 수를 정렬한다.","limits":"N ≤ 10,000,000 / 값 ≤ 10,000 / 시간 O(N+K)","logic":"값 자체를 인덱스로 쓴다. 비교 정렬의 N log N 하한을 우회하는 유일한 경우.","code":"def counting_sort(arr, max_value):\n    count = [0] * (max_value + 1)\n    for x in arr:\n        count[x] += 1\n    res = []\n    for v in range(max_value + 1):\n        res.extend([v] * count[v])\n    return res","lv":4},{"id":"bs-basic","cat":"이분탐색","title":"이분탐색 기본형","brief":"정렬된 배열에서 target의 인덱스를 찾고 없으면 -1.","limits":"N ≤ 1,000,000 / 시간 O(log N)","logic":"while lo <= hi, mid = (lo+hi)//2. 경계 조건은 항상 lo <= hi와 hi = mid-1 / lo = mid+1 한 쌍으로 외운다.","code":"def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n            return mid\n        if arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1","lv":4},{"id":"tp-window","cat":"투포인터","title":"합이 S 이상인 최소 길이","brief":"양수 배열에서 부분합이 S 이상이 되는 가장 짧은 연속 구간의 길이.","limits":"N ≤ 100,000 / 시간 O(N)","logic":"오른쪽을 한 칸씩 늘려 합을 키우고, 조건을 만족하는 동안 왼쪽을 당겨 최솟값을 갱신한다. 양수 배열에서만 성립.","code":"def min_window(arr, s):\n    left = 0\n    total = 0\n    best = len(arr) + 1\n    for right in range(len(arr)):\n        total += arr[right]\n        while total >= s:\n            best = min(best, right - left + 1)\n            total -= arr[left]\n            left += 1\n    return best if best <= len(arr) else 0","lv":4},{"id":"tp-pair","cat":"투포인터","title":"두 수의 합","brief":"정렬된 배열에서 합이 정확히 target인 쌍의 개수.","limits":"N ≤ 100,000 / 시간 O(N log N)","logic":"양 끝에서 좁혀온다. 합이 작으면 왼쪽을 밀고 크면 오른쪽을 당긴다. 중복 값이 있으면 같은 값 묶음 개수를 곱한다.","code":"def count_pairs(arr, target):\n    arr = sorted(arr)\n    lo, hi = 0, len(arr) - 1\n    cnt = 0\n    while lo < hi:\n        total = arr[lo] + arr[hi]\n        if total == target:\n            cnt += 1\n            lo += 1\n            hi -= 1\n        elif total < target:\n            lo += 1\n        else:\n            hi -= 1\n    return cnt","lv":4},{"id":"st-bracket","cat":"자료구조","title":"괄호 유효성 검사","brief":"(), [], {} 가 올바르게 짝지어졌는지 판정한다.","limits":"길이 ≤ 100,000 / 시간 O(N)","logic":"여는 괄호는 push, 닫는 괄호는 top과 짝이 맞는지 확인 후 pop. 마지막에 스택이 비어야 참.","code":"def is_valid(s):\n    pair = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pair:\n            if not stack or stack[-1] != pair[ch]:\n                return False\n            stack.pop()\n    return not stack","lv":4},{"id":"dfs-cc","cat":"DFS","title":"연결 요소 개수와 크기","brief":"무방향 그래프에서 연결 요소의 개수와 각 크기를 구한다.","limits":"N ≤ 100,000 / 시간 O(N+E)","logic":"재귀 대신 스택으로 돌린다. 파이썬은 재귀 깊이 제한(기본 1000)에 걸리기 쉬워 반복형이 안전하다.","code":"def connected_components(n, graph):\n    visited = [False] * n\n    sizes = []\n    for s in range(n):\n        if visited[s]:\n            continue\n        visited[s] = True\n        stack = [s]\n        size = 0\n        while stack:\n            cur = stack.pop()\n            size += 1\n            for nxt in graph[cur]:\n                if not visited[nxt]:\n                    visited[nxt] = True\n                    stack.append(nxt)\n        sizes.append(size)\n    return len(sizes), sizes","lv":4},{"id":"bfs-grid","cat":"BFS","title":"격자 최단거리","brief":"0은 벽, 1은 길인 격자에서 (0,0)부터 (N-1,M-1)까지 최소 칸 수.","limits":"N, M ≤ 1000 / 시간 O(NM)","logic":"dist 배열 하나로 방문 표시와 거리를 동시에 관리한다. 큐에 넣을 때 방문 처리해야 중복 삽입이 없다.","code":"from collections import deque\n\n\ndef shortest_path(grid):\n    n, m = len(grid), len(grid[0])\n    dist = [[0] * m for _ in range(n)]\n    dr, dc = [-1, 1, 0, 0], [0, 0, -1, 1]\n    q = deque([(0, 0)])\n    dist[0][0] = 1\n    while q:\n        r, c = q.popleft()\n        if (r, c) == (n - 1, m - 1):\n            return dist[r][c]\n        for d in range(4):\n            nr, nc = r + dr[d], c + dc[d]\n            if 0 <= nr < n and 0 <= nc < m and grid[nr][nc] == 1 and dist[nr][nc] == 0:\n                dist[nr][nc] = dist[r][c] + 1\n                q.append((nr, nc))\n    return -1","lv":4},{"id":"bfs-multi","cat":"BFS","title":"다중 시작점 BFS","brief":"여러 시작점에서 동시에 퍼질 때 전부 채우는 데 걸리는 날짜. 못 채우면 -1.","limits":"N, M ≤ 1000 / 시간 O(NM)","logic":"시작점을 전부 큐에 미리 넣고 한 번만 BFS를 돌린다. 시작점마다 따로 돌리면 시간 초과.","code":"from collections import deque\n\n\ndef spread_days(grid):\n    n, m = len(grid), len(grid[0])\n    q = deque()\n    fresh = 0\n    for r in range(n):\n        for c in range(m):\n            if grid[r][c] == 1:\n                q.append((r, c, 0))\n            elif grid[r][c] == 0:\n                fresh += 1\n    dr, dc = [-1, 1, 0, 0], [0, 0, -1, 1]\n    days = 0\n    while q:\n        r, c, d = q.popleft()\n        days = d\n        for i in range(4):\n            nr, nc = r + dr[i], c + dc[i]\n            if 0 <= nr < n and 0 <= nc < m and grid[nr][nc] == 0:\n                grid[nr][nc] = 1\n                fresh -= 1\n                q.append((nr, nc, d + 1))\n    return days if fresh == 0 else -1","lv":4},{"id":"bt-subset","cat":"백트래킹","title":"부분수열의 합","brief":"수열에서 합이 S가 되는 부분수열의 개수 (공집합 제외).","limits":"N ≤ 20 / 시간 O(2^N)","logic":"각 원소마다 '쓴다 / 안 쓴다' 두 갈래로 내려간다. N이 40쯤 되면 반씩 나눠 푸는 meet-in-the-middle로 바꾼다.","code":"def count_subsets(arr, s):\n    n = len(arr)\n    count = 0\n\n    def back(i, total, picked):\n        nonlocal count\n        if i == n:\n            if picked and total == s:\n                count += 1\n            return\n        back(i + 1, total + arr[i], picked + 1)\n        back(i + 1, total, picked)\n\n    back(0, 0, 0)\n    return count","lv":4},{"id":"dp-stairs","cat":"DP","title":"계단 오르기 점화식","brief":"한 번에 1칸 또는 2칸 오를 때 N칸을 오르는 경우의 수.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"dp[i] = dp[i-1] + dp[i-2]. 모든 선형 DP의 원형이다. 초기값 두 개를 먼저 못 박고 시작한다.","code":"def climb(n):\n    if n <= 2:\n        return n\n    dp = [0] * (n + 1)\n    dp[1], dp[2] = 1, 2\n    for i in range(3, n + 1):\n        dp[i] = dp[i - 1] + dp[i - 2]\n    return dp[n]","lv":4},{"id":"dp-coin","cat":"DP","title":"동전 교환","brief":"동전 종류가 주어질 때 금액 K를 만드는 최소 동전 개수. 불가능하면 -1.","limits":"K ≤ 10,000 / 시간 O(NK)","logic":"INF로 초기화하고 dp[0]=0. 개수 최소화는 정순 순회(무한 개 사용 가능). 경우의 수를 셀 땐 루프 순서가 반대다.","code":"def min_coins(coins, target):\n    INF = float(\"inf\")\n    dp = [INF] * (target + 1)\n    dp[0] = 0\n    for coin in coins:\n        for amount in range(coin, target + 1):\n            dp[amount] = min(dp[amount], dp[amount - coin] + 1)\n    return dp[target] if dp[target] != INF else -1","lv":4},{"id":"str-palin","cat":"문자열","title":"최장 팰린드롬 부분문자열","brief":"문자열에서 앞뒤가 같은 가장 긴 연속 구간.","limits":"길이 ≤ 2,000 / 시간 O(N²)","logic":"각 위치를 중심으로 양쪽으로 벌린다. 길이가 홀수인 경우와 짝수인 경우를 따로 돌려야 한다.","code":"def longest_palindrome(s):\n    best = \"\"\n\n    def expand(lo, hi):\n        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:\n            lo -= 1\n            hi += 1\n        return s[lo + 1:hi]\n\n    for i in range(len(s)):\n        odd = expand(i, i)\n        even = expand(i, i + 1)\n        for cand in (odd, even):\n            if len(cand) > len(best):\n                best = cand\n    return best","lv":4},{"id":"math-sieve","cat":"수학","title":"에라토스테네스의 체","brief":"N 이하의 소수를 모두 구한다.","limits":"N ≤ 1,000,000 / 시간 O(N log log N)","logic":"i*i부터 지우기 시작하고 i는 √N까지만 본다. 슬라이스 대입으로 한 번에 지우면 훨씬 빠르다.","code":"def sieve(n):\n    is_prime = [True] * (n + 1)\n    is_prime[0] = is_prime[1] = False\n    i = 2\n    while i * i <= n:\n        if is_prime[i]:\n            is_prime[i * i::i] = [False] * len(is_prime[i * i::i])\n        i += 1\n    return [x for x in range(2, n + 1) if is_prime[x]]","lv":4},{"id":"math-gcd","cat":"수학","title":"GCD · 빠른 거듭제곱","brief":"최대공약수, 최소공배수, 그리고 a^b mod m.","limits":"값 ≤ 10¹⁸ / 시간 O(log N)","logic":"유클리드 호제법은 a, b = b, a % b 한 줄. 거듭제곱은 지수를 이진수로 보고 절반씩 접는다.","code":"def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\n\n\ndef lcm(a, b):\n    return a // gcd(a, b) * b\n\n\ndef power_mod(base, exp, mod):\n    result = 1\n    base %= mod\n    while exp > 0:\n        if exp & 1:\n            result = result * base % mod\n        base = base * base % mod\n        exp >>= 1\n    return result","lv":4},{"id":"bs-bound","cat":"이분탐색","title":"lower / upper bound","brief":"정렬 배열에서 target 이상이 처음 나오는 위치, target 초과가 처음 나오는 위치.","limits":"N ≤ 1,000,000 / 시간 O(log N)","logic":"while lo < hi, hi = mid 를 쓴다. upper는 부등호에 등호를 하나 더 붙이는 것만 다르다. 개수 = upper - lower.","code":"def lower_bound(arr, target):\n    lo, hi = 0, len(arr)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo\n\n\ndef upper_bound(arr, target):\n    lo, hi = 0, len(arr)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if arr[mid] <= target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo","lv":5},{"id":"bs-param","cat":"이분탐색","title":"파라메트릭 서치","brief":"길이 N의 랜선들을 잘라 K개를 만들 때 가능한 최대 길이.","limits":"N ≤ 10,000 / 길이 ≤ 2³¹−1 / 시간 O(N log max)","logic":"답 자체를 이분탐색한다. possible(x)가 단조(참→거짓)여야 성립. 최댓값을 찾을 땐 참이면 lo = mid+1, 답은 hi.","code":"def max_cut_length(lines, k):\n    def count(length):\n        return sum(x // length for x in lines)\n\n    lo, hi = 1, max(lines)\n    answer = 0\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if count(mid) >= k:\n            answer = mid\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return answer","lv":5},{"id":"st-monotonic","cat":"자료구조","title":"오큰수 (모노토닉 스택)","brief":"각 원소의 오른쪽에서 처음으로 자기보다 큰 수. 없으면 -1.","limits":"N ≤ 1,000,000 / 시간 O(N)","logic":"인덱스를 담은 감소 스택을 유지한다. 현재 값이 스택 top보다 크면 그 top의 답이 확정되므로 꺼내면서 채운다.","code":"def next_greater(arr):\n    res = [-1] * len(arr)\n    stack = []\n    for i, x in enumerate(arr):\n        while stack and arr[stack[-1]] < x:\n            res[stack.pop()] = x\n        stack.append(i)\n    return res","lv":5},{"id":"pq-kth","cat":"우선순위큐","title":"최소/최대 힙 다루기","brief":"스트림에서 K번째로 큰 값을 매번 알아낸다.","limits":"N ≤ 200,000 / 시간 O(N log K)","logic":"크기 K인 최소 힙을 유지하면 루트가 K번째 큰 값. 파이썬 heapq는 최소 힙뿐이라 최대 힙은 부호를 뒤집는다.","code":"import heapq\n\n\ndef kth_largest_stream(nums, k):\n    heap = []\n    res = []\n    for x in nums:\n        heapq.heappush(heap, x)\n        if len(heap) > k:\n            heapq.heappop(heap)\n        res.append(heap[0] if len(heap) == k else -1)\n    return res","lv":5},{"id":"pq-room","cat":"우선순위큐","title":"최소 회의실 개수","brief":"회의 [시작, 끝] 목록에 필요한 최소 회의실 수.","limits":"N ≤ 200,000 / 시간 O(N log N)","logic":"시작 시각 기준 정렬 후 끝나는 시각을 최소 힙에 넣는다. 가장 빨리 끝나는 회의가 이미 끝났으면 방을 재사용한다.","code":"import heapq\n\n\ndef min_rooms(meetings):\n    meetings = sorted(meetings)\n    heap = []\n    for start, end in meetings:\n        if heap and heap[0] <= start:\n            heapq.heappop(heap)\n        heapq.heappush(heap, end)\n    return len(heap)","lv":5},{"id":"bt-nqueen","cat":"백트래킹","title":"N-Queen","brief":"N×N 체스판에 서로 공격하지 않는 퀸 N개를 놓는 경우의 수.","limits":"N ≤ 14 / 시간 O(N!) 가지치기 포함","logic":"행 단위로 내려가며 열·대각선 두 방향을 집합으로 막는다. 대각선 키는 r+c 와 r-c.","code":"def n_queens(n):\n    cols = set()\n    diag1 = set()\n    diag2 = set()\n    count = 0\n\n    def back(row):\n        nonlocal count\n        if row == n:\n            count += 1\n            return\n        for c in range(n):\n            if c in cols or (row + c) in diag1 or (row - c) in diag2:\n                continue\n            cols.add(c)\n            diag1.add(row + c)\n            diag2.add(row - c)\n            back(row + 1)\n            cols.remove(c)\n            diag1.remove(row + c)\n            diag2.remove(row - c)\n\n    back(0)\n    return count","lv":5},{"id":"dp-knapsack","cat":"DP","title":"0-1 배낭","brief":"무게 한도 W에서 물건을 골라 가치 합을 최대로.","limits":"N ≤ 100, W ≤ 100,000 / 시간 O(NW)","logic":"1차원 dp를 무게 역순으로 순회해야 같은 물건을 두 번 담지 않는다. 정순으로 돌면 무한 배낭이 된다.","code":"def knapsack(items, capacity):\n    dp = [0] * (capacity + 1)\n    for weight, value in items:\n        for w in range(capacity, weight - 1, -1):\n            dp[w] = max(dp[w], dp[w - weight] + value)\n    return dp[capacity]","lv":5},{"id":"dp-lis","cat":"DP","title":"최장 증가 부분수열","brief":"수열에서 증가하는 부분수열의 최대 길이.","limits":"N ≤ 1,000,000 / 시간 O(N log N)","logic":"값을 담는 tails 배열에 bisect_left로 덮어쓴다. tails는 실제 LIS가 아니라 길이만 보장한다는 점이 함정.","code":"from bisect import bisect_left\n\n\ndef lis_length(arr):\n    tails = []\n    for x in arr:\n        i = bisect_left(tails, x)\n        if i == len(tails):\n            tails.append(x)\n        else:\n            tails[i] = x\n    return len(tails)","lv":5},{"id":"dp-lcs","cat":"DP","title":"최장 공통 부분수열","brief":"두 문자열의 공통 부분수열 중 가장 긴 것의 길이.","limits":"길이 ≤ 5,000 / 시간 O(NM)","logic":"글자가 같으면 왼쪽 위 대각선 +1, 다르면 위/왼쪽 중 큰 값. 2차원 표의 기본형.","code":"def lcs_length(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    return dp[n][m]","lv":5},{"id":"gr-dijkstra","cat":"최단경로","title":"다익스트라","brief":"가중치가 음이 아닌 그래프에서 시작점부터 모든 정점까지 최단 거리.","limits":"V ≤ 20,000, E ≤ 300,000 / 시간 O(E log V)","logic":"힙에서 꺼낸 거리가 기록된 거리보다 크면 버린다(지연 삭제). 이 한 줄이 없으면 시간 초과가 난다.","code":"import heapq\n\n\ndef dijkstra(n, graph, start):\n    INF = float(\"inf\")\n    dist = [INF] * n\n    dist[start] = 0\n    heap = [(0, start)]\n    while heap:\n        d, cur = heapq.heappop(heap)\n        if d > dist[cur]:\n            continue\n        for nxt, w in graph[cur]:\n            nd = d + w\n            if nd < dist[nxt]:\n                dist[nxt] = nd\n                heapq.heappush(heap, (nd, nxt))\n    return dist","lv":5},{"id":"gr-floyd","cat":"최단경로","title":"플로이드-워셜","brief":"모든 정점 쌍 사이의 최단 거리를 한 번에 구한다.","limits":"V ≤ 400 / 시간 O(V³)","logic":"경유지 k가 가장 바깥 루프여야 한다. 순서를 바꾸면 답이 틀린다.","code":"def floyd(n, edges):\n    INF = float(\"inf\")\n    dist = [[INF] * n for _ in range(n)]\n    for i in range(n):\n        dist[i][i] = 0\n    for u, v, w in edges:\n        dist[u][v] = min(dist[u][v], w)\n    for k in range(n):\n        for i in range(n):\n            for j in range(n):\n                if dist[i][k] + dist[k][j] < dist[i][j]:\n                    dist[i][j] = dist[i][k] + dist[k][j]\n    return dist","lv":5},{"id":"gr-topo","cat":"그래프","title":"위상 정렬","brief":"선행 관계가 있는 작업들의 수행 순서. 사이클이 있으면 빈 리스트.","limits":"V ≤ 32,000, E ≤ 100,000 / 시간 O(V+E)","logic":"진입차수 0인 정점을 큐에 넣고 빼면서 이웃의 차수를 깎는다. 결과 길이가 V보다 작으면 사이클이 있다.","code":"from collections import deque\n\n\ndef topological_sort(n, graph):\n    indegree = [0] * n\n    for u in range(n):\n        for v in graph[u]:\n            indegree[v] += 1\n    q = deque([i for i in range(n) if indegree[i] == 0])\n    order = []\n    while q:\n        cur = q.popleft()\n        order.append(cur)\n        for nxt in graph[cur]:\n            indegree[nxt] -= 1\n            if indegree[nxt] == 0:\n                q.append(nxt)\n    return order if len(order) == n else []","lv":5},{"id":"gr-mst","cat":"그래프","title":"크루스칼 + 유니온 파인드","brief":"모든 정점을 잇는 최소 비용 신장 트리의 가중치 합.","limits":"V ≤ 10,000, E ≤ 100,000 / 시간 O(E log E)","logic":"간선을 가중치순으로 정렬하고 사이클이 안 생길 때만 채택. find는 경로 압축, union은 랭크 비교.","code":"def kruskal(n, edges):\n    parent = list(range(n))\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n\n    def union(a, b):\n        ra, rb = find(a), find(b)\n        if ra == rb:\n            return False\n        parent[rb] = ra\n        return True\n\n    total = 0\n    for w, u, v in sorted(edges):\n        if union(u, v):\n            total += w\n    return total","lv":5},{"id":"tree-dfs","cat":"트리","title":"트리 부모·깊이 구하기","brief":"루트가 1인 트리에서 각 노드의 부모와 깊이를 구한다.","limits":"N ≤ 100,000 / 시간 O(N)","logic":"부모 배열이 곧 방문 배열 역할을 한다. 반복형 BFS로 돌려야 재귀 깊이 제한을 피한다.","code":"from collections import deque\n\n\ndef tree_info(n, graph, root=0):\n    parent = [-1] * n\n    depth = [0] * n\n    visited = [False] * n\n    visited[root] = True\n    q = deque([root])\n    while q:\n        cur = q.popleft()\n        for nxt in graph[cur]:\n            if not visited[nxt]:\n                visited[nxt] = True\n                parent[nxt] = cur\n                depth[nxt] = depth[cur] + 1\n                q.append(nxt)\n    return parent, depth","lv":5},{"id":"str-kmp","cat":"문자열","title":"KMP 패턴 매칭","brief":"문자열 안에서 패턴이 나타나는 모든 시작 위치.","limits":"길이 ≤ 1,000,000 / 시간 O(N+M)","logic":"실패 함수 pi[i] = 접두사와 접미사가 일치하는 최대 길이. 본 매칭 루프는 실패 함수 만드는 루프와 구조가 똑같다.","code":"def build_pi(pattern):\n    pi = [0] * len(pattern)\n    j = 0\n    for i in range(1, len(pattern)):\n        while j > 0 and pattern[i] != pattern[j]:\n            j = pi[j - 1]\n        if pattern[i] == pattern[j]:\n            j += 1\n            pi[i] = j\n    return pi\n\n\ndef kmp(text, pattern):\n    pi = build_pi(pattern)\n    res = []\n    j = 0\n    for i in range(len(text)):\n        while j > 0 and text[i] != pattern[j]:\n            j = pi[j - 1]\n        if text[i] == pattern[j]:\n            if j == len(pattern) - 1:\n                res.append(i - len(pattern) + 1)\n                j = pi[j]\n            else:\n                j += 1\n    return res","lv":5},{"id":"bit-tsp","cat":"비트마스킹","title":"외판원 순회 (비트마스크 DP)","brief":"모든 도시를 한 번씩 방문하고 출발지로 돌아오는 최소 비용.","limits":"N ≤ 16 / 시간 O(2^N · N²)","logic":"상태는 (방문 집합, 현재 도시). 방문 여부를 정수 비트로 압축하는 게 핵심. N이 20을 넘으면 못 쓴다.","code":"def tsp(cost):\n    n = len(cost)\n    INF = float(\"inf\")\n    full = (1 << n) - 1\n    dp = [[INF] * n for _ in range(1 << n)]\n    dp[1][0] = 0\n    for mask in range(1 << n):\n        for cur in range(n):\n            if dp[mask][cur] == INF or not (mask & (1 << cur)):\n                continue\n            for nxt in range(n):\n                if mask & (1 << nxt) or cost[cur][nxt] == 0:\n                    continue\n                nmask = mask | (1 << nxt)\n                value = dp[mask][cur] + cost[cur][nxt]\n                if value < dp[nmask][nxt]:\n                    dp[nmask][nxt] = value\n    best = INF\n    for cur in range(1, n):\n        if dp[full][cur] != INF and cost[cur][0]:\n            best = min(best, dp[full][cur] + cost[cur][0])\n    return best","lv":5},{"id":"ct-fastio","cat":"실전","title":"빠른 입출력 + 다중 테스트케이스","brief":"테스트케이스가 여러 개인 문제를 한 번에 읽고 한 번에 출력한다.","limits":"입력 1,000,000줄 / 시간 O(N)","logic":"전부 read().split()으로 읽고 인덱스를 밀면서 쓴다. 출력도 매번 print 하지 말고 리스트에 모아 한 번에 쓴다. 이것만으로 시간 초과가 풀리는 문제가 많다.","code":"import sys\n\n\ndef main():\n    data = sys.stdin.read().split()\n    idx = 0\n    t = int(data[idx])\n    idx += 1\n    out = []\n    for _ in range(t):\n        n = int(data[idx])\n        idx += 1\n        nums = list(map(int, data[idx:idx + n]))\n        idx += n\n        out.append(str(sum(nums)))\n    sys.stdout.write(\"\\n\".join(out))","lv":6},{"id":"ct-sim-dir","cat":"실전","title":"방향 전환 시뮬레이션","brief":"명령대로 회전하고 전진하되 격자 밖으로는 나가지 않는다.","limits":"명령 ≤ 100,000 / 시간 O(N)","logic":"방향 배열을 북·동·남·서 시계 순서로 두면 오른쪽은 +1, 왼쪽은 +3 (즉 -1)을 4로 나눈 나머지. 순서를 섞어 적으면 전부 틀린다.","code":"def simulate(commands, n):\n    dr, dc = [-1, 0, 1, 0], [0, 1, 0, -1]\n    r = c = d = 0\n    for cmd in commands:\n        if cmd == \"L\":\n            d = (d + 3) % 4\n        elif cmd == \"R\":\n            d = (d + 1) % 4\n        else:\n            nr, nc = r + dr[d], c + dc[d]\n            if 0 <= nr < n and 0 <= nc < n:\n                r, c = nr, nc\n    return r, c, d","lv":6},{"id":"ct-bfs-state","cat":"실전","title":"상태를 추가한 BFS","brief":"벽을 최대 K번 부술 수 있을 때의 최단 거리.","limits":"N, M ≤ 1000, K ≤ 10 / 시간 O(NMK)","logic":"visited를 [행][열][남은 기회] 3차원으로 늘리는 게 전부다. 같은 칸이라도 남은 기회가 다르면 다른 상태라는 점이 핵심.","code":"from collections import deque\n\n\ndef shortest_with_break(grid, limit):\n    n, m = len(grid), len(grid[0])\n    dist = [[[0] * (limit + 1) for _ in range(m)] for _ in range(n)]\n    dr, dc = [-1, 1, 0, 0], [0, 0, -1, 1]\n    q = deque([(0, 0, 0)])\n    dist[0][0][0] = 1\n    while q:\n        r, c, k = q.popleft()\n        if (r, c) == (n - 1, m - 1):\n            return dist[r][c][k]\n        for i in range(4):\n            nr, nc = r + dr[i], c + dc[i]\n            if not (0 <= nr < n and 0 <= nc < m):\n                continue\n            if grid[nr][nc] == 0 and dist[nr][nc][k] == 0:\n                dist[nr][nc][k] = dist[r][c][k] + 1\n                q.append((nr, nc, k))\n            elif grid[nr][nc] == 1 and k < limit and dist[nr][nc][k + 1] == 0:\n                dist[nr][nc][k + 1] = dist[r][c][k] + 1\n                q.append((nr, nc, k + 1))\n    return -1","lv":6},{"id":"ct-dp-path","cat":"실전","title":"DP + 경로 복원","brief":"최댓값만이 아니라 그 값을 만든 실제 답까지 되짚는다.","limits":"길이 ≤ 5,000 / 시간 O(NM)","logic":"표를 다 채운 뒤 오른쪽 아래에서 거꾸로 걸어 나온다. 글자가 같으면 대각선으로, 아니면 큰 쪽으로. 마지막에 뒤집는 걸 잊지 않는다.","code":"def lcs_with_path(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    path = []\n    i, j = n, m\n    while i > 0 and j > 0:\n        if a[i - 1] == b[j - 1]:\n            path.append(a[i - 1])\n            i -= 1\n            j -= 1\n        elif dp[i - 1][j] >= dp[i][j - 1]:\n            i -= 1\n        else:\n            j -= 1\n    return dp[n][m], \"\".join(reversed(path))","lv":6},{"id":"ct-compress","cat":"실전","title":"좌표 압축","brief":"값의 범위는 넓지만 개수는 적을 때 인덱스로 눌러 담는다.","limits":"N ≤ 1,000,000 / 시간 O(N log N)","logic":"중복 제거 후 정렬한 표를 만들고 bisect_left로 순위를 찾는다. 배열 크기를 값 범위가 아니라 개수로 줄이는 전처리.","code":"from bisect import bisect_left\n\n\ndef compress(nums):\n    table = sorted(set(nums))\n    return [bisect_left(table, x) for x in nums], table","lv":6}];

    try { embedded = (window.top !== window.self); } catch (e) { embedded = true; }
    if (!embedded && !(window.claude && typeof window.claude.use === 'function')) { resolve(null); return; }
    var t0 = Date.now();

    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'miss', a: a[i] }); i++; }

function grade(original, answer, lang) {
  var A = normalize(original, lang), B = normalize(answer, lang);

  var rate = (A.length + B.length) ? Math.round((2 * d.lcs / (A.length + B.length)) * 1000) / 10 : 0;

  /* pair up miss/extra runs so near-misses read as one edited line */
  var rows = [], tags = {}, i = 0;
  function tag(t) { tags[t] = (tags[t] || 0) + 1; }
  while (i < d.ops.length) {
    var op = d.ops[i];
    if (op.t === 'same') { rows.push({ k: 'same', d: op.a.depth, t: op.a.text }); i++; continue; }
    var miss = [], extra = [];
    while (i < d.ops.length && d.ops[i].t === 'miss') { miss.push(d.ops[i].a); i++; }
    while (i < d.ops.length && d.ops[i].t === 'extra') { extra.push(d.ops[i].b); i++; }
    var pairs = Math.min(miss.length, extra.length), k;
    for (k = 0; k < pairs; k++) {
      var h = markPair(miss[k].text, extra[k].text);
      rows.push({ k: 'miss', d: miss[k].depth, html: h[0] });
      rows.push({ k: 'extra', d: extra[k].depth, html: h[1] });
      if (miss[k].text === extra[k].text) tag('들여쓰기'); else tag(tagOf(miss[k].text));
    }
    for (k = pairs; k < miss.length; k++) { rows.push({ k: 'miss', d: miss[k].depth, t: miss[k].text }); tag(tagOf(miss[k].text)); }
    for (k = pairs; k < extra.length; k++) { rows.push({ k: 'extra', d: extra[k].depth, t: extra[k].text }); tag('불필요한 라인'); }
  }

  /* structural check */
  var fa = features(A), fb = features(B), checks = [];
  Object.keys(fa).forEach(function (k) {
    var need = fa[k], got = fb[k] || 0;
    checks.push({ k: k, need: need, got: got, ok: got >= need });
  });
  checks.sort(function (x, y) { return (x.ok === y.ok) ? y.need - x.need : (x.ok ? 1 : -1); });

  return {
    rate: rate, rows: rows, checks: checks,
    tags: Object.keys(tags).map(function (k) { return { k: k, n: tags[k] }; }).sort(function (a, b) { return b.n - a.n; }),
    origLines: A.length, userLines: B.length, matched: d.lcs

}

  return lines.join('\n');
}
function traceLines(t) { return t.split('\n').filter(function (l) { return l.trim(); }).length; }
function mastery(p) {
  var need = S.settings.streakNeed, st = p.streak || 0;
  if (p.masteredAt) {
    if (dayDiff(p.masteredAt, today()) > S.settings.decayDays)
      return { k: 'recheck', label: '재확인 필요', st: st, need: need };
    return { k: 'done', label: '암기 완료', st: st, need: need };
  }
  if (st > 0) return { k: 'near', label: '굳히는 중 ' + st + '/' + need, st: st, need: need };
  if ((p.attempts || []).length) return { k: '암기중', label: '암기 중', st: 0, need: need };
  return { k: 'none', label: '미착수', st: 0, need: need };
}
function masteryChip(m) {
  var cls = m.k === 'done' ? 'accent' : (m.k === 'recheck' ? 'bad' : (m.k === 'near' ? 'warn' : ''));
  return '<span class="chip ' + cls + '">' + (m.k === 'done' ? '✓ ' : '') + esc(m.label) + '</span>';
}
function masteredCount() {
  return S.problems.filter(function (p) { return mastery(p).k === 'done'; }).length;
}
function gateProblem() {
  if (!S.settings.gate) return null;
  if (S.settings.gateDone === today()) return null;
  var due = dueList();
  if (due.length) return { p: due[0].p, i: due[0].i };
  var re = S.problems.filter(function (p) { return mastery(p).k === 'recheck'; });
  if (re.length) return { p: re[0], i: null };
  return null;
}
function rateClass(r) { return r == null ? '' : (r >= S.settings.pass ? 'g' : (r >= 60 ? 'w' : 'b')); }
function nextDue(p) {
  var arr = (p.schedule || []).filter(function (s) { return !s.done; });
  if (!arr.length) return null;
  arr.sort(function (a, b) { return a.due < b.due ? -1 : 1; });
  return arr[0].due;
}

function courseItems(c) { return CATALOG.filter(function (x) { return x.lv === c.lv; }); }
function bySrcMap() {
  var m = {};
  S.problems.forEach(function (p) { if (p.srcId) m[p.srcId] = p; });
  return m;
}
function courseStat(c) {
  var items = courseItems(c), m = bySrcMap(), reg = 0, done = 0, drilled = 0;
  items.forEach(function (it) {
    var p = m[it.id];
    if (!p) return;
    reg++;
    if ((p.attempts || []).length) drilled++;
    if (mastery(p).k === 'done') done++;
  });
  return { items: items, map: m, n: items.length, reg: reg, done: done, drilled: drilled };
}
function itemState(p) {
  if (!p) return { k: 'none', label: '미등록' };
  var m = mastery(p);
  if (m.k === 'done') return { k: 'done', label: '암기 완료' };
  if (m.k === 'recheck') return { k: 'recheck', label: '재확인' };
  if (m.k === 'near') return { k: 'near', label: m.label };
  if ((p.attempts || []).length) return { k: 'wip', label: '연습 중' };
  return { k: 'reg', label: '등록됨' };
}
function stateChip(st) {
  var cls = st.k === 'done' ? 'accent' : (st.k === 'recheck' ? 'bad' : (st.k === 'near' ? 'warn' : ''));
  return '<span class="chip ' + cls + '">' + (st.k === 'done' ? '✓ ' : '') + esc(st.label) + '</span>';
}
function packRegistered() {
  var have = {};
  S.problems.forEach(function (p) { if (p.srcId) have[p.srcId] = 1; });
  return have;
}
function viewPack() {
  if (S.courseSel) return viewCourseDetail();

  var have = packRegistered();
  var h = '<div class="sect-h"><h2>코스</h2><span class="sub">낮은 단계부터 순서대로</span></div>';

  h += '<div class="stack-g" style="margin-bottom:22px">' + COURSES.map(function (c) {

      }).join('') + '</div>';
  }).join('');
  return h;
